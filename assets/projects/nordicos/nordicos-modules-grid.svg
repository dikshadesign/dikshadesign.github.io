<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .module-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4; }
      .screen-inner { fill: #0f172a; stroke: #1e293b; stroke-width: 1; rx: 3; }
      .code-font { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
      .tag { rx: 3; }
    </style>
  </defs>

  <rect width="1200" height="580" class="bg"/>

  <!-- Top Title Banner -->
  <rect x="40" y="20" width="1120" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="60" y="46" class="font-sans" font-size="14px" font-weight="700" fill="#0f172a">Section 04 · The Six Operational Layers of Nordic OS</text>
  <text x="730" y="46" class="font-sans" font-size="11px" fill="#64748b">Organised within a coherent operating environment rather than isolated tools</text>

  <!-- 6 MODULES IN 2 ROWS OF 3 -->
  <g transform="translate(40, 76)">
    
    <!-- ROW 1, COL 1: Project Tracking -->
    <g transform="translate(0, 0)">
      <rect width="360" height="230" class="module-card"/>
      <rect width="360" height="30" fill="#0f172a" rx="4 4 0 0"/>
      <text x="14" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">01 / Project Tracking</text>
      <text x="260" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#38bdf8">CENTRAL CONTEXT</text>

      <!-- Mini UI preview -->
      <g transform="translate(14, 40)">
        <rect width="332" height="70" class="screen-inner"/>
        <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">Active Project: PRJ-204 Actuator Assembly</text>
        <rect x="10" y="26" width="312" height="6" rx="2" fill="#1e293b"/>
        <rect x="10" y="26" width="245" height="6" rx="2" fill="#38bdf8"/>
        <text x="10" y="48" class="font-sans" font-size="11px" font-weight="700" fill="#f8fafc">78.4% Completed</text>
        <text x="240" y="48" class="font-sans" font-size="9px" fill="#10b981">Milestone: Assembly Phase</text>
      </g>

      <g transform="translate(14, 120)">
        <text x="0" y="14" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">Operational Role</text>
        <text x="0" y="30" class="font-sans" font-size="9.5px" fill="#475569">Provides a project-level view of progress, status, and ongoing work. Acts as the parent relational anchor tying together drawings, components, and floor shifts.</text>
        
        <rect y="74" width="332" height="24" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
        <text x="10" y="90" class="code-font" font-size="8.5px" fill="#334155">Primary Relational Key: project_id</text>
      </g>
    </g>

    <!-- ROW 1, COL 2: DAP & Documentation -->
    <g transform="translate(380, 0)">
      <rect width="360" height="230" class="module-card"/>
      <rect width="360" height="30" fill="#4f46e5" rx="4 4 0 0"/>
      <text x="14" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">02 / DAP &amp; Documentation</text>
      <text x="250" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#c7d2fe">APPROVAL GATEWAY</text>

      <g transform="translate(14, 40)">
        <rect width="332" height="70" class="screen-inner"/>
        <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">Design Approval Process (DAP) · Rev 3.2</text>
        <rect x="10" y="26" width="95" height="18" rx="2" fill="#059669"/>
        <text x="57" y="38" text-anchor="middle" class="font-sans" font-size="7.5px" font-weight="700" fill="#fff">ENG APPROVED</text>
        <rect x="115" y="26" width="95" height="18" rx="2" fill="#059669"/>
        <text x="162" y="38" text-anchor="middle" class="font-sans" font-size="7.5px" font-weight="700" fill="#fff">QA APPROVED</text>
        <rect x="220" y="26" width="95" height="18" rx="2" fill="#d97706"/>
        <text x="267" y="38" text-anchor="middle" class="font-sans" font-size="7.5px" font-weight="700" fill="#fff">CLIENT SIGN-OFF</text>
        <text x="10" y="58" class="font-sans" font-size="8px" fill="#cbd5e1">Attached: CAD_Drawing_A402_Final.step</text>
      </g>

      <g transform="translate(14, 120)">
        <text x="0" y="14" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">Operational Role</text>
        <text x="0" y="30" class="font-sans" font-size="9.5px" fill="#475569">Supports the relevant engineering documentation, CAD revision locks, and multi-tier approval sign-offs required before manufacturing starts.</text>
        
        <rect y="74" width="332" height="24" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
        <text x="10" y="90" class="code-font" font-size="8.5px" fill="#334155">Revision Lock: dap_signatures_status</text>
      </g>
    </g>

    <!-- ROW 1, COL 3: Bill of Materials (BOM) -->
    <g transform="translate(760, 0)">
      <rect width="360" height="230" class="module-card"/>
      <rect width="360" height="30" fill="#0284c7" rx="4 4 0 0"/>
      <text x="14" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">03 / Bill of Materials (BOM)</text>
      <text x="250" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#bae6fd">STRUCTURE TREE</text>

      <g transform="translate(14, 40)">
        <rect width="332" height="70" class="screen-inner"/>
        <text x="10" y="18" class="code-font" font-size="8.5px" fill="#38bdf8">├─ Piston_Assy_A (Sub-assembly)</text>
        <text x="10" y="32" class="code-font" font-size="8.5px" fill="#94a3b8">│  ├─ ACT-901-T (Titanium Rod) x1</text>
        <text x="10" y="46" class="code-font" font-size="8.5px" fill="#94a3b8">│  └─ SEAL-O-12 (Viton Seal) x4</text>
        <text x="10" y="60" class="code-font" font-size="8.5px" fill="#38bdf8">└─ Valve_Block_B (Sub-assembly)</text>
      </g>

      <g transform="translate(14, 120)">
        <text x="0" y="14" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">Operational Role</text>
        <text x="0" y="30" class="font-sans" font-size="9.5px" fill="#475569">Organises the components, materials, and assemblies required for a product into a queryable relational tree with unit costs and supplier part numbers.</text>
        
        <rect y="74" width="332" height="24" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
        <text x="10" y="90" class="code-font" font-size="8.5px" fill="#334155">Recursive Schema: bom_line_items</text>
      </g>
    </g>

    <!-- ROW 2, COL 1: Procurement -->
    <g transform="translate(0, 245)">
      <rect width="360" height="230" class="module-card"/>
      <rect width="360" height="30" fill="#d97706" rx="4 4 0 0"/>
      <text x="14" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">04 / Procurement</text>
      <text x="250" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#fde68a">SOURCING PIPELINE</text>

      <g transform="translate(14, 40)">
        <rect width="332" height="70" class="screen-inner"/>
        <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">PO-8812 · Supplier: Bosch Rexroth AG</text>
        <text x="10" y="36" class="font-sans" font-size="11px" font-weight="700" fill="#f8fafc">2x Proportional Valves</text>
        <rect x="230" y="26" width="90" height="18" rx="2" fill="#d97706"/>
        <text x="275" y="38" text-anchor="middle" class="font-sans" font-size="8px" font-weight="700" fill="#fff">ETA: TODAY 16:00</text>
        <text x="10" y="56" class="font-sans" font-size="8.5px" fill="#10b981">✓ Tracking: DHL-Express #9012489</text>
      </g>

      <g transform="translate(14, 120)">
        <text x="0" y="14" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">Operational Role</text>
        <text x="0" y="30" class="font-sans" font-size="9.5px" fill="#475569">Supports purchasing workflows associated with sourcing required BOM parts, monitoring vendor delivery lead times, and receiving inspection.</text>
        
        <rect y="74" width="332" height="24" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
        <text x="10" y="90" class="code-font" font-size="8.5px" fill="#334155">Dock Sourcing: purchase_orders</text>
      </g>
    </g>

    <!-- ROW 2, COL 2: Manufacturing & Assembly -->
    <g transform="translate(380, 245)">
      <rect width="360" height="230" class="module-card"/>
      <rect width="360" height="30" fill="#059669" rx="4 4 0 0"/>
      <text x="14" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">05 / Manufacturing &amp; Assembly</text>
      <text x="250" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#a7f3d0">SHOP FLOOR ROUTING</text>

      <g transform="translate(14, 40)">
        <rect width="332" height="70" class="screen-inner"/>
        <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">Assembly Station 02 · Work Order #WO-402</text>
        <text x="10" y="36" class="font-sans" font-size="11px" font-weight="700" fill="#f8fafc">Step 2: Piston Seal Installation</text>
        <rect x="230" y="26" width="90" height="18" rx="2" fill="#059669"/>
        <text x="275" y="38" text-anchor="middle" class="font-sans" font-size="8px" font-weight="700" fill="#fff">RUNNING LIVE</text>
        <text x="10" y="56" class="font-sans" font-size="8.5px" fill="#38bdf8">Gloved Touch Interface Active</text>
      </g>

      <g transform="translate(14, 120)">
        <text x="0" y="14" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">Operational Role</text>
        <text x="0" y="30" class="font-sans" font-size="9.5px" fill="#475569">Connects project requirements to shop-floor work—providing assembly technicians with sequential work steps, torque specifications, and stage gating.</text>
        
        <rect y="74" width="332" height="24" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
        <text x="10" y="90" class="code-font" font-size="8.5px" fill="#334155">Execution Model: assembly_routes</text>
      </g>
    </g>

    <!-- ROW 2, COL 3: HR & Internal Operations -->
    <g transform="translate(760, 245)">
      <rect width="360" height="230" class="module-card"/>
      <rect width="360" height="30" fill="#7c3aed" rx="4 4 0 0"/>
      <text x="14" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">06 / HR &amp; Internal Operations</text>
      <text x="250" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#e9d5ff">PEOPLE OPERATIONS</text>

      <g transform="translate(14, 40)">
        <rect width="332" height="70" class="screen-inner"/>
        <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">Floor Technician Skill Roster (Shift A)</text>
        <text x="10" y="36" class="font-sans" font-size="10.5px" font-weight="700" fill="#f8fafc">14 Technicians On Duty</text>
        <rect x="230" y="26" width="90" height="18" rx="2" fill="#7c3aed"/>
        <text x="275" y="38" text-anchor="middle" class="font-sans" font-size="8px" font-weight="700" fill="#fff">ROSTER SYNCED</text>
        <text x="10" y="56" class="font-sans" font-size="8.5px" fill="#c084fc">✓ ISO Cleanroom &amp; Torque Certified</text>
      </g>

      <g transform="translate(14, 120)">
        <text x="0" y="14" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">Operational Role</text>
        <text x="0" y="30" class="font-sans" font-size="9.5px" fill="#475569">Extends the platform beyond pure production into company operations—managing technician skill matrices, shift rosters, and safety qualifications.</text>
        
        <rect y="74" width="332" height="24" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
        <text x="10" y="90" class="code-font" font-size="8.5px" fill="#334155">Personnel Schema: technician_rosters</text>
      </g>
    </g>

  </g>
</svg>

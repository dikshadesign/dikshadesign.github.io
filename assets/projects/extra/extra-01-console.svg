<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d27"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>
    <linearGradient id="knobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b465a"/>
      <stop offset="100%" stop-color="#1e2532"/>
    </linearGradient>
    <linearGradient id="accentLed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#455ea9"/>
      <stop offset="100%" stop-color="#2a3b72"/>
    </linearGradient>
    <pattern id="gridDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2d3748" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Surface -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#gridDots)"/>

  <!-- Console Outer Frame -->
  <rect x="60" y="50" width="680" height="400" fill="#141821" stroke="#2a3344" stroke-width="2"/>
  
  <!-- Screws on Corners -->
  <circle cx="80" cy="70" r="4" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="720" cy="70" r="4" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="80" cy="430" r="4" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="720" cy="430" r="4" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Top Status Banner -->
  <rect x="80" y="70" width="640" height="36" fill="#0d1117" stroke="#1f2735" stroke-width="1"/>
  <text x="100" y="93" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#38bdf8" font-weight="700">RIG-01 // TACTILE HARDWARE CONSOLE</text>
  <text x="560" y="93" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#10b981">STATUS: ONLINE [48.2ms]</text>
  <circle cx="700" cy="88" r="4" fill="#10b981"/>

  <!-- Section 1: Rotary Encoders (Left) -->
  <rect x="90" y="130" width="280" height="290" fill="#181e2b" stroke="#253043" stroke-width="1"/>
  <text x="110" y="156" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" font-weight="600">STEPPED ROTARY ENCODERS (x4)</text>

  <!-- Knob 1 -->
  <g transform="translate(160, 220)">
    <circle cx="0" cy="0" r="42" fill="url(#knobGrad)" stroke="#4b5563" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="#11151e"/>
    <line x1="0" y1="-28" x2="0" y2="-12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="58" font-family="'SF Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">EXPOSURE</text>
    <text x="0" y="72" font-family="'Inter', sans-serif" font-size="11" fill="#f8fafc" font-weight="700" text-anchor="middle">+14.2 EV</text>
  </g>

  <!-- Knob 2 -->
  <g transform="translate(290, 220)">
    <circle cx="0" cy="0" r="42" fill="url(#knobGrad)" stroke="#4b5563" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="#11151e"/>
    <line x1="12" y1="-24" x2="6" y2="-12" stroke="#455ea9" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="58" font-family="'SF Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">STROBE GAIN</text>
    <text x="0" y="72" font-family="'Inter', sans-serif" font-size="11" fill="#f8fafc" font-weight="700" text-anchor="middle">850 mA</text>
  </g>

  <!-- Slider Bar Below Knobs -->
  <g transform="translate(110, 350)">
    <rect x="0" y="0" width="240" height="8" rx="4" fill="#0b0f15"/>
    <rect x="0" y="0" width="160" height="8" rx="4" fill="#455ea9"/>
    <rect x="150" y="-8" width="20" height="24" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <text x="0" y="32" font-family="'SF Mono', monospace" font-size="10" fill="#64748b">THRESHOLD CALIBRATION</text>
    <text x="240" y="32" font-family="'SF Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="end">68%</text>
  </g>

  <!-- Section 2: Mechanical Switches & E-Stop (Right) -->
  <rect x="390" y="130" width="310" height="290" fill="#181e2b" stroke="#253043" stroke-width="1"/>
  <text x="410" y="156" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" font-weight="600">TOGGLES &amp; EMERGENCY INTERLOCK</text>

  <!-- 4 Toggle Switches -->
  <g transform="translate(420, 190)">
    <!-- Switch 1 -->
    <rect x="0" y="0" width="46" height="70" fill="#11151e" stroke="#334155" stroke-width="1"/>
    <rect x="18" y="10" width="10" height="28" rx="3" fill="#38bdf8"/>
    <text x="23" y="86" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">TRIG 1</text>

    <!-- Switch 2 -->
    <rect x="65" y="0" width="46" height="70" fill="#11151e" stroke="#334155" stroke-width="1"/>
    <rect x="83" y="10" width="10" height="28" rx="3" fill="#38bdf8"/>
    <text x="88" y="86" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">TRIG 2</text>

    <!-- Switch 3 -->
    <rect x="130" y="0" width="46" height="70" fill="#11151e" stroke="#334155" stroke-width="1"/>
    <rect x="148" y="32" width="10" height="28" rx="3" fill="#64748b"/>
    <text x="153" y="86" font-family="'SF Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">AUX</text>

    <!-- Switch 4 -->
    <rect x="195" y="0" width="46" height="70" fill="#11151e" stroke="#334155" stroke-width="1"/>
    <rect x="213" y="10" width="10" height="28" rx="3" fill="#10b981"/>
    <text x="218" y="86" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">SYNC</text>
  </g>

  <!-- Big Industrial Push Button (E-Stop / Capture) -->
  <g transform="translate(545, 335)">
    <circle cx="0" cy="0" r="46" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
    <circle cx="0" cy="0" r="34" fill="#b91c1c"/>
    <circle cx="0" cy="0" r="26" fill="#dc2626"/>
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.08em" text-anchor="middle">SNAP / HALT</text>
    <text x="0" y="62" font-family="'SF Mono', monospace" font-size="10" fill="#f87171" text-anchor="middle">HARDWARE CAPTURE INTERRUPT</text>
  </g>
</svg>

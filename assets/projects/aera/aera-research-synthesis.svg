<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .card-header { fill: #f1f5f9; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .pill-badge { fill: rgba(82, 105, 181, 0.12); stroke: rgba(82, 105, 181, 0.3); rx: 10; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9px; font-weight: 700; fill: #5269b5; letter-spacing: 0.08em; text-transform: uppercase; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11px; line-height: 1.5; fill: #475569; }
      .metric { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; fill: #1e293b; letter-spacing: -0.03em; }
      .metric-sub { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
      .chart-line { stroke: #5269b5; stroke-width: 2.5; fill: none; }
      .chart-fill { fill: rgba(82, 105, 181, 0.1); }
      .chart-axis { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 2 2; }
      .highlight-box { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1; rx: 3; }
      .quote-box { fill: #f8fafc; stroke-left: #5269b5; stroke: #e2e8f0; rx: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="550" class="bg"/>

  <!-- Top Banner -->
  <rect x="40" y="30" width="1120" height="50" class="card"/>
  <text x="64" y="60" class="title" font-size="16px">AERA · Research Synthesis &amp; Spatial Constraints Analysis</text>
  <text x="740" y="59" class="body" font-size="11.5px">Contextual inquiry across 4 commercial properties · Facility manager interviews &amp; environmental audits</text>

  <!-- 4 Column Research Synthesis Grid -->
  <!-- Col 1: Ceiling Grid Infrastructure -->
  <g transform="translate(40, 100)">
    <rect width="265" height="410" class="card"/>
    <rect width="265" height="38" class="card-header"/>
    <text x="18" y="24" class="title">01 / Ceiling Infrastructure</text>
    <rect x="180" y="10" width="72" height="18" class="pill-badge"/>
    <text x="216" y="22" text-anchor="middle" class="pill-text">MODULAR</text>

    <!-- Schematic: 600x600 grid -->
    <g transform="translate(32, 60)">
      <rect x="0" y="0" width="200" height="120" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="0" y1="60" x2="200" y2="60" stroke="#cbd5e1" stroke-dasharray="3 3"/>
      <line x1="100" y1="0" x2="100" y2="120" stroke="#cbd5e1" stroke-dasharray="3 3"/>
      <!-- AERA Form inside standard grid -->
      <rect x="55" y="15" width="90" height="90" fill="#ffffff" stroke="#5269b5" stroke-width="2" rx="4"/>
      <circle cx="100" cy="60" r="26" fill="#f1f5f9" stroke="#5269b5" stroke-width="1.5"/>
      <circle cx="100" cy="60" r="10" fill="#5269b5"/>
      <!-- Dimensions -->
      <text x="100" y="115" text-anchor="middle" font-size="9px" fill="#64748b" font-weight="600">600 × 600 mm</text>
    </g>

    <text x="20" y="210" class="title" font-size="12px">Key Constraint Findings:</text>
    <text x="20" y="235" class="body">• Standard commercial ceiling tile format: 600 × 600 mm</text>
    <text x="20" y="255" class="body">• T-bar suspension supports max 12 kg load</text>
    <text x="20" y="275" class="body">• Plenum depth varies from 180 mm to 450 mm</text>
    <text x="20" y="295" class="body">• HVAC duct collision avoided via modular tile swap</text>

    <rect x="16" y="325" width="233" height="65" class="highlight-box"/>
    <text x="28" y="348" font-size="10.5px" font-weight="700" fill="#15803d">Design Implication:</text>
    <text x="28" y="368" font-size="10px" fill="#166534">Drop-in chassis fits existing ceiling grid rails without structural retrofitting.</text>
  </g>

  <!-- Col 2: Occupancy & Contaminant Dynamics -->
  <g transform="translate(325, 100)">
    <rect width="265" height="410" class="card"/>
    <rect width="265" height="38" class="card-header"/>
    <text x="18" y="24" class="title">02 / Contaminant Patterns</text>
    <rect x="190" y="10" width="62" height="18" class="pill-badge"/>
    <text x="221" y="22" text-anchor="middle" class="pill-text">SENSOR</text>

    <!-- Mini Chart: Afternoon PM2.5 / CO2 Spike -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="215" height="120" fill="#ffffff" stroke="#e2e8f0"/>
      <!-- Chart lines -->
      <line x1="20" y1="20" x2="200" y2="20" class="chart-axis"/>
      <line x1="20" y1="60" x2="200" y2="60" class="chart-axis"/>
      <line x1="20" y1="100" x2="200" y2="100" class="chart-axis"/>
      
      <!-- Curve -->
      <path d="M 25 90 Q 60 85 90 65 T 140 30 T 195 75 L 195 105 L 25 105 Z" class="chart-fill"/>
      <path d="M 25 90 Q 60 85 90 65 T 140 30 T 195 75" class="chart-line"/>
      <circle cx="140" cy="30" r="4" fill="#ef4444"/>
      <text x="140" y="20" text-anchor="middle" font-size="9px" font-weight="700" fill="#ef4444">Peak 14:00 (1420 ppm)</text>
      <!-- Time labels -->
      <text x="25" y="115" font-size="8px" fill="#94a3b8">09:00</text>
      <text x="110" y="115" font-size="8px" fill="#94a3b8">13:00</text>
      <text x="185" y="115" font-size="8px" fill="#94a3b8">18:00</text>
    </g>

    <text x="20" y="210" class="title" font-size="12px">Environmental Findings:</text>
    <text x="20" y="235" class="body">• Peak occupancy creates localized CO2 &amp; particulate pockets</text>
    <text x="20" y="260" class="body">• Meeting rooms reach unsafe CO2 threshold within 40 minutes</text>
    <text x="20" y="285" class="body">• Floor units cause drafts without resolving high-level stale air</text>

    <rect x="16" y="325" width="233" height="65" class="highlight-box"/>
    <text x="28" y="348" font-size="10.5px" font-weight="700" fill="#15803d">Design Implication:</text>
    <text x="28" y="368" font-size="10px" fill="#166534">Ceiling integration draws warm rising air and purifies radially from overhead.</text>
  </g>

  <!-- Col 3: Serviceability & Upkeep Study -->
  <g transform="translate(610, 100)">
    <rect width="265" height="410" class="card"/>
    <rect width="265" height="38" class="card-header"/>
    <text x="18" y="24" class="title">03 / Service &amp; Maintenance</text>
    <rect x="185" y="10" width="67" height="18" class="pill-badge"/>
    <text x="218" y="22" text-anchor="middle" class="pill-text">ROUTINE</text>

    <!-- Visual: Ergonomic Reach Study -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="205" height="120" fill="#f8fafc" stroke="#e2e8f0"/>
      <!-- Ceiling Line -->
      <line x1="20" y1="20" x2="185" y2="20" stroke="#1e293b" stroke-width="2"/>
      <text x="100" y="14" text-anchor="middle" font-size="8.5px" fill="#64748b">Ceiling Plane (2.8m - 3.2m)</text>
      <!-- Magnetic Quick-release hatch -->
      <rect x="75" y="20" width="50" height="15" fill="#5269b5" rx="2"/>
      <!-- Drop down arrow -->
      <path d="M 100 38 L 100 68 M 94 62 L 100 68 L 106 62" stroke="#5269b5" stroke-width="1.8"/>
      <!-- Cartridge -->
      <rect x="80" y="70" width="40" height="25" fill="#ffffff" stroke="#5269b5" stroke-width="1.5" rx="2"/>
      <text x="100" y="86" text-anchor="middle" font-size="8px" font-weight="700" fill="#5269b5">FILTER</text>
      <text x="100" y="112" text-anchor="middle" font-size="8px" fill="#64748b">Magnetic release &lt; 30 sec</text>
    </g>

    <text x="20" y="210" class="title" font-size="12px">Maintenance Observations:</text>
    <text x="20" y="235" class="body">• 78% of commercial filters are replaced past manufacturer deadline</text>
    <text x="20" y="260" class="body">• Facility techs manage up to 40 rooms per floor plate</text>
    <text x="20" y="285" class="body">• Screws and complicated latches cause service delays</text>

    <rect x="16" y="325" width="233" height="65" class="highlight-box"/>
    <text x="28" y="348" font-size="10.5px" font-weight="700" fill="#15803d">Design Implication:</text>
    <text x="28" y="368" font-size="10px" fill="#166534">Quarter-turn magnetic drop mechanism allows filter swap without opening plenum.</text>
  </g>

  <!-- Col 4: Standalone vs Distributed Coverage -->
  <g transform="translate(895, 100)">
    <rect width="265" height="410" class="card"/>
    <rect width="265" height="38" class="card-header"/>
    <text x="18" y="24" class="title">04 / Spatial Coverage</text>
    <rect x="175" y="10" width="77" height="18" class="pill-badge"/>
    <text x="213" y="22" text-anchor="middle" class="pill-text">DISTRIBUTED</text>

    <!-- Comparison Diagram -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="215" height="120" fill="#ffffff" stroke="#e2e8f0"/>
      <!-- Left: Single corner unit -->
      <rect x="10" y="15" width="90" height="90" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="2 2"/>
      <circle cx="20" cy="95" r="7" fill="#ef4444"/>
      <circle cx="20" cy="95" r="40" fill="none" stroke="#ef4444" opacity="0.3"/>
      <text x="55" y="100" font-size="8px" fill="#ef4444" font-weight="600">Single Corner</text>

      <!-- Right: Distributed 4 units -->
      <rect x="115" y="15" width="90" height="90" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="2 2"/>
      <circle cx="138" cy="38" r="4" fill="#10b981"/>
      <circle cx="182" cy="38" r="4" fill="#10b981"/>
      <circle cx="138" cy="82" r="4" fill="#10b981"/>
      <circle cx="182" cy="82" r="4" fill="#10b981"/>
      <text x="160" y="100" text-anchor="middle" font-size="8px" fill="#10b981" font-weight="600">Distributed 4x</text>
    </g>

    <text x="20" y="210" class="title" font-size="12px">Distribution Metrics:</text>
    <text x="20" y="235" class="body">• 4x distributed units deliver 64% more uniform airflow</text>
    <text x="20" y="260" class="body">• Eliminates floor clutter and cable tripping hazards</text>
    <text x="20" y="285" class="body">• Sound level drops from 54 dBA (single large) to 32 dBA (distributed)</text>

    <rect x="16" y="325" width="233" height="65" class="highlight-box"/>
    <text x="28" y="348" font-size="10.5px" font-weight="700" fill="#15803d">Design Implication:</text>
    <text x="28" y="368" font-size="10px" fill="#166534">Low-noise distributed nodes operate continuously in human hearing background.</text>
  </g>
</svg>

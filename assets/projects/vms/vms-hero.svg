<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .shell { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 8; }
      .surface-card { fill: #131d33; stroke: #24324f; stroke-width: 1.2; rx: 6; }
      .surface-card-sub { fill: #0a0f1d; stroke: #1e293b; stroke-width: 1; rx: 4; }
      .phone-frame { fill: #0b1120; stroke: #334155; stroke-width: 2; rx: 20; }
      .phone-screen { fill: #0f172a; rx: 14; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .text-title { font-family: "Inter", sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .text-sub { font-family: "Inter", sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .badge-purple { fill: rgba(168, 85, 247, 0.15); stroke: #a855f7; stroke-width: 1; rx: 3; }
      .badge-green { fill: rgba(16, 185, 129, 0.15); stroke: #10b981; stroke-width: 1; rx: 3; }
      .badge-blue { fill: rgba(59, 130, 246, 0.15); stroke: #3b82f6; stroke-width: 1; rx: 3; }
    </style>
    <linearGradient id="guardActionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hostInviteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" class="bg"/>

  <!-- Desktop Operating Window Frame -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="640" class="shell"/>

    <!-- App Shell Header -->
    <path d="M 0 8 Q 0 0 8 0 L 1132 0 Q 1140 0 1140 8 L 1140 52 L 0 52 Z" fill="#090e1a"/>
    <line x1="0" y1="52" x2="1140" y2="52" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Window Controls -->
    <circle cx="25" cy="26" r="5" fill="#ef4444"/>
    <circle cx="42" cy="26" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="26" r="5" fill="#10b981"/>

    <!-- Nordic Visitor Brand / Logo -->
    <g transform="translate(90, 16)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#a855f7"/>
      <circle cx="11" cy="9" r="4" fill="#090e1a"/>
      <path d="M 5 19 Q 11 14 17 19" fill="#090e1a"/>
      <text x="32" y="16" class="font-sans" font-size="13px" font-weight="700" fill="#f8fafc" letter-spacing="0.04em">Nordic <tspan fill="#c084fc">Visitor</tspan></text>
      <text x="145" y="16" class="font-sans" font-size="11.5px" font-weight="500" fill="#64748b">/ Enterprise Multi-Role Platform</text>
    </g>

    <!-- Global Platform Status -->
    <g transform="translate(860, 14)">
      <rect x="0" y="2" width="145" height="22" rx="11" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="13" r="3.5" fill="#10b981"/>
      <text x="24" y="16" class="font-sans" font-size="10px" font-weight="600" fill="#34d399">Cloud Ecosystem · Live</text>
      <circle cx="170" cy="13" r="13" fill="#334155"/>
      <text x="170" y="17" text-anchor="middle" class="font-sans" font-size="10px" font-weight="700" fill="#f8fafc">Sec</text>
    </g>

    <!-- Sub-header: The 3 Coordinated Roles -->
    <g transform="translate(30, 75)">
      <text x="0" y="20" class="font-sans" font-size="19px" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">Synchronized 3-Role Visitor Management Architecture</text>
      <text x="0" y="40" class="font-sans" font-size="12px" fill="#94a3b8">One unified platform linking Company Employee Hosts, Visitor Mobile Pre-Registration, and Gate Security Guard Clearance.</text>
    </g>

    <!-- ============================================================== -->
    <!-- SURFACE 01: COMPANY EMPLOYEE / HOST (Left Column: 340px)      -->
    <!-- ============================================================== -->
    <g transform="translate(30, 130)">
      <rect width="330" height="480" class="surface-card"/>

      <!-- Card Header -->
      <g transform="translate(18, 20)">
        <rect x="0" y="0" width="80" height="20" class="badge-purple"/>
        <text x="40" y="14" text-anchor="middle" class="font-sans" font-size="10px" font-weight="700" fill="#c084fc">ROLE 01 · HOST</text>
        <text x="0" y="44" class="text-title">Company Host Portal</text>
        <text x="0" y="62" class="text-sub">Employees invite guests &amp; set entry criteria</text>
      </g>

      <!-- Invite Modal / Form Card -->
      <g transform="translate(18, 96)">
        <rect width="294" height="240" class="surface-card-sub"/>

        <!-- Form Title -->
        <text x="14" y="24" class="font-sans" font-size="12px" font-weight="700" fill="#f8fafc">New Visitor Invitation</text>
        <line x1="14" y1="34" x2="280" y2="34" stroke="#1e293b" stroke-width="1"/>

        <!-- Field 1: Visitor Name & Company -->
        <text x="14" y="52" class="font-sans" font-size="10px" font-weight="600" fill="#64748b">VISITOR NAME &amp; ORG</text>
        <rect x="14" y="58" width="266" height="28" rx="3" fill="#131c31" stroke="#334155" stroke-width="1"/>
        <text x="24" y="76" class="font-sans" font-size="11px" fill="#f1f5f9">Marcus Vance · Apex Tooling GmbH</text>

        <!-- Field 2: Meeting Zone & Host -->
        <text x="14" y="104" class="font-sans" font-size="10px" font-weight="600" fill="#64748b">DESTINATION ZONE</text>
        <rect x="14" y="110" width="266" height="28" rx="3" fill="#131c31" stroke="#334155" stroke-width="1"/>
        <text x="24" y="128" class="font-sans" font-size="11px" fill="#cbd5e1">CNC Bay 04 (Precision Machining)</text>

        <!-- Field 3: Compliance Toggles -->
        <text x="14" y="156" class="font-sans" font-size="10px" font-weight="600" fill="#64748b">MANDATORY PREREQUISITES</text>
        <g transform="translate(14, 164)">
          <rect x="0" y="0" width="12" height="12" rx="2" fill="#8b5cf6"/>
          <path d="M 2 6 L 5 9 L 10 3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          <text x="18" y="10" class="font-sans" font-size="10.5px" fill="#e2e8f0">IP Non-Disclosure (NDA)</text>

          <rect x="142" y="0" width="12" height="12" rx="2" fill="#8b5cf6"/>
          <path d="M 144 6 L 147 9 L 152 3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          <text x="160" y="10" class="font-sans" font-size="10.5px" fill="#e2e8f0">OSHA Safety Brief</text>
        </g>

        <!-- Send Invite Action Button -->
        <rect x="14" y="196" width="266" height="32" rx="4" fill="url(#hostInviteGrad)"/>
        <text x="147" y="216" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="600" fill="#ffffff">Send Pre-Registration Link →</text>
      </g>

      <!-- Host Alert Status Pill -->
      <g transform="translate(18, 354)">
        <rect width="294" height="106" class="surface-card-sub"/>
        <text x="14" y="22" class="font-sans" font-size="10.5px" font-weight="700" fill="#a855f7">REAL-TIME HOST NOTIFICATION</text>
        <rect x="14" y="32" width="266" height="60" rx="4" fill="#131d33" stroke="#334155" stroke-width="1"/>
        <circle cx="32" cy="62" r="10" fill="#10b981"/>
        <path d="M 28 62 L 31 65 L 36 59" stroke="#ffffff" stroke-width="1.5" fill="none"/>
        <text x="50" y="55" class="font-sans" font-size="11px" font-weight="600" fill="#f8fafc">Visitor Arrived at Gate 01</text>
        <text x="50" y="71" class="font-sans" font-size="10px" fill="#94a3b8">Marcus Vance cleared by Guard · Badge #412</text>
      </g>
    </g>

    <!-- Connector 1 -> 2 -->
    <g transform="translate(365, 340)">
      <line x1="0" y1="0" x2="32" y2="0" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="36,0 30,-4 30,4" fill="#8b5cf6"/>
      <text x="18" y="-8" text-anchor="middle" class="font-sans" font-size="9px" font-weight="600" fill="#c084fc">SMS LINK</text>
    </g>

    <!-- ============================================================== -->
    <!-- SURFACE 02: THE VISITOR (Center Column: 310px - Mobile Web)   -->
    <!-- ============================================================== -->
    <g transform="translate(405, 130)">
      <rect width="320" height="480" class="surface-card"/>

      <!-- Card Header -->
      <g transform="translate(18, 20)">
        <rect x="0" y="0" width="90" height="20" class="badge-blue"/>
        <text x="45" y="14" text-anchor="middle" class="font-sans" font-size="10px" font-weight="700" fill="#60a5fa">ROLE 02 · VISITOR</text>
        <text x="0" y="44" class="text-title">Mobile Web Pre-Check-in</text>
        <text x="0" y="62" class="text-sub">Fills details, signs NDA &amp; gets QR pass</text>
      </g>

      <!-- Phone Mockup Frame -->
      <g transform="translate(45, 82)">
        <rect width="230" height="380" class="phone-frame"/>
        <rect x="6" y="8" width="218" height="364" class="phone-screen"/>

        <!-- Phone Top Speaker Notch -->
        <rect x="85" y="14" width="60" height="4" rx="2" fill="#334155"/>

        <!-- Mobile Web Header -->
        <text x="20" y="44" class="font-sans" font-size="11px" font-weight="700" fill="#f8fafc">Nordic Visitor Pass</text>
        <text x="20" y="58" class="font-sans" font-size="9px" fill="#94a3b8">Host: Sarah Lin · Engineering</text>
        <line x1="16" y1="66" x2="202" y2="66" stroke="#1e293b" stroke-width="1"/>

        <!-- Pre-Check-in Status Checklist -->
        <g transform="translate(16, 74)">
          <rect width="186" height="52" rx="4" fill="#131c31" stroke="#1e293b"/>
          <circle cx="16" cy="18" r="6" fill="#10b981"/>
          <path d="M 13 18 L 15 20 L 19 16" stroke="#ffffff" stroke-width="1.2" fill="none"/>
          <text x="28" y="21" class="font-sans" font-size="9.5px" font-weight="600" fill="#f1f5f9">Personal &amp; Vehicle Details</text>

          <circle cx="16" cy="38" r="6" fill="#10b981"/>
          <path d="M 13 38 L 15 40 L 19 36" stroke="#ffffff" stroke-width="1.2" fill="none"/>
          <text x="28" y="41" class="font-sans" font-size="9.5px" font-weight="600" fill="#f1f5f9">Signed Mutual NDA</text>
        </g>

        <!-- Digital QR Pass Card -->
        <g transform="translate(24, 136)">
          <rect width="170" height="175" rx="6" fill="#ffffff"/>
          <text x="85" y="20" text-anchor="middle" class="font-sans" font-size="10px" font-weight="700" fill="#0a0a0a">GATE ACCESS PASS</text>
          <text x="85" y="32" text-anchor="middle" class="font-sans" font-size="8.5px" fill="#64748b">Marcus Vance · 14:00 - 18:00</text>

          <!-- QR Code Grid Mockup -->
          <g transform="translate(40, 42)">
            <rect width="90" height="90" fill="#f8fafc" stroke="#e2e8f0"/>
            <rect x="8" y="8" width="24" height="24" fill="#0a0a0a"/>
            <rect x="12" y="12" width="16" height="16" fill="#ffffff"/>
            <rect x="14" y="14" width="12" height="12" fill="#0a0a0a"/>

            <rect x="58" y="8" width="24" height="24" fill="#0a0a0a"/>
            <rect x="62" y="12" width="16" height="16" fill="#ffffff"/>
            <rect x="64" y="14" width="12" height="12" fill="#0a0a0a"/>

            <rect x="8" y="58" width="24" height="24" fill="#0a0a0a"/>
            <rect x="12" y="62" width="16" height="16" fill="#ffffff"/>
            <rect x="14" y="64" width="12" height="12" fill="#0a0a0a"/>

            <!-- Center data dots -->
            <rect x="38" y="20" width="8" height="8" fill="#0a0a0a"/>
            <rect x="42" y="36" width="14" height="14" fill="#0a0a0a"/>
            <rect x="60" y="44" width="10" height="10" fill="#0a0a0a"/>
            <rect x="38" y="60" width="12" height="8" fill="#0a0a0a"/>
            <rect x="64" y="66" width="16" height="8" fill="#0a0a0a"/>
          </g>

          <text x="85" y="152" text-anchor="middle" class="font-sans" font-size="8px" font-weight="600" fill="#059669">✓ PRE-CONFIRMED &amp; READY</text>
          <text x="85" y="164" text-anchor="middle" class="font-sans" font-size="7.5px" fill="#64748b">Present to Security Guard at Gate</text>
        </g>

        <!-- Confirmation Note -->
        <text x="109" y="338" text-anchor="middle" class="font-sans" font-size="8.5px" fill="#94a3b8">Details locked · Show code on arrival</text>
      </g>
    </g>

    <!-- Connector 2 -> 3 -->
    <g transform="translate(730, 340)">
      <line x1="0" y1="0" x2="32" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="36,0 30,-4 30,4" fill="#10b981"/>
      <text x="18" y="-8" text-anchor="middle" class="font-sans" font-size="9px" font-weight="600" fill="#34d399">PRESENT QR</text>
    </g>

    <!-- ============================================================== -->
    <!-- SURFACE 03: SECURITY GUARD (Right Column: 360px - Gate Console)-->
    <!-- ============================================================== -->
    <g transform="translate(770, 130)">
      <rect width="340" height="480" class="surface-card"/>

      <!-- Card Header -->
      <g transform="translate(18, 20)">
        <rect x="0" y="0" width="95" height="20" class="badge-green"/>
        <text x="47" y="14" text-anchor="middle" class="font-sans" font-size="10px" font-weight="700" fill="#34d399">ROLE 03 · GUARD</text>
        <text x="0" y="44" class="text-title">Security Guard Console</text>
        <text x="0" y="62" class="text-sub">Verifies credentials &amp; grants final access</text>
      </g>

      <!-- Active Visitor Verification Card -->
      <g transform="translate(18, 96)">
        <rect width="304" height="240" class="surface-card-sub"/>

        <!-- Header status -->
        <g transform="translate(14, 16)">
          <text x="0" y="12" class="font-sans" font-size="10.5px" font-weight="700" fill="#f8fafc">INCOMING VISITOR CLEARANCE</text>
          <rect x="180" y="-2" width="96" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
          <text x="228" y="10" text-anchor="middle" class="font-sans" font-size="9px" font-weight="700" fill="#34d399">QR MATCHED</text>
        </g>

        <!-- Visitor Credentials Details -->
        <g transform="translate(14, 46)">
          <!-- Visitor Snapshot -->
          <rect x="0" y="0" width="46" height="46" rx="4" fill="#1e293b" stroke="#334155"/>
          <circle cx="23" cy="18" r="9" fill="#64748b"/>
          <path d="M 10 40 Q 23 28 36 40" fill="#64748b"/>

          <!-- Details text -->
          <text x="56" y="16" class="font-sans" font-size="13px" font-weight="700" fill="#ffffff">Marcus Vance</text>
          <text x="56" y="32" class="font-sans" font-size="11px" fill="#94a3b8">Contractor · Apex Tooling GmbH</text>
          <text x="56" y="46" class="font-sans" font-size="10px" fill="#cbd5e1">Vehicle Plate: <tspan fill="#f8fafc" font-weight="600">HH-TX 489</tspan></text>
        </g>

        <line x1="14" y1="104" x2="290" y2="104" stroke="#1e293b" stroke-width="1"/>

        <!-- Compliance Matrix -->
        <g transform="translate(14, 114)">
          <text x="0" y="12" class="font-sans" font-size="10px" fill="#64748b">HOST &amp; SPONSOR</text>
          <text x="0" y="28" class="font-sans" font-size="11px" font-weight="600" fill="#f1f5f9">Sarah Lin (Lead Metrology)</text>

          <text x="160" y="12" class="font-sans" font-size="10px" fill="#64748b">ACCESS ZONE</text>
          <text x="160" y="28" class="font-sans" font-size="11px" font-weight="600" fill="#a855f7">CNC Bay 04</text>

          <text x="0" y="52" class="font-sans" font-size="10px" fill="#64748b">NDA STATUS</text>
          <text x="0" y="66" class="font-sans" font-size="10.5px" font-weight="600" fill="#34d399">✓ Signed &amp; Timestamped</text>

          <text x="160" y="52" class="font-sans" font-size="10px" fill="#64748b">SAFETY PROTOCOL</text>
          <text x="160" y="66" class="font-sans" font-size="10.5px" font-weight="600" fill="#34d399">✓ PPE Confirmed</text>
        </g>

        <!-- Final Access Grant Action Button -->
        <rect x="14" y="194" width="276" height="34" rx="4" fill="url(#guardActionGrad)"/>
        <text x="152" y="215" text-anchor="middle" class="font-sans" font-size="12px" font-weight="700" fill="#ffffff">✓ Grant Final Access &amp; Check-In</text>
      </g>

      <!-- Security Headcount & Muster Roll Strip -->
      <g transform="translate(18, 354)">
        <rect width="304" height="106" class="surface-card-sub"/>
        <g transform="translate(14, 16)">
          <text x="0" y="12" class="font-sans" font-size="10.5px" font-weight="700" fill="#64748b">ACTIVE ON-SITE HEADCOUNT</text>
          <text x="0" y="44" class="font-sans" font-size="28px" font-weight="800" fill="#f8fafc">18 <tspan font-size="12px" font-weight="500" fill="#94a3b8">Active Visitors</tspan></text>
          <text x="0" y="64" class="font-sans" font-size="10px" fill="#34d399">● All 18 verified with signed NDAs</text>

          <rect x="170" y="22" width="108" height="30" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
          <text x="224" y="41" text-anchor="middle" class="font-sans" font-size="10px" font-weight="700" fill="#f87171">Muster Roll ↗</text>
        </g>
      </g>
    </g>

  </g>
</svg>

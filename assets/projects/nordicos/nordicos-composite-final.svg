<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070d19; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .window-glow { filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6)); }
      .code-font { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="640" class="bg"/>

  <circle cx="250" cy="200" r="200" fill="#0284c7" opacity="0.08" filter="blur(70px)"/>
  <circle cx="950" cy="450" r="220" fill="#10b981" opacity="0.08" filter="blur(80px)"/>

  <!-- Top Title Banner -->
  <rect x="40" y="24" width="1120" height="42" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="4"/>
  <text x="60" y="50" class="font-sans" font-size="14px" font-weight="700" fill="#f8fafc">Nordic OS · End-to-End Operational Operating System in Working Production</text>
  <text x="730" y="50" class="font-sans" font-size="11px" fill="#94a3b8">Product Strategy · Information Architecture · Design System · Full-Stack Development</text>

  <!-- MULTI-SCREEN COMPOSITION: Desktop PM Hub + Rugged Floor Tablet + Code & Database -->
  <g transform="translate(60, 90)">
    
    <!-- MAIN APPLICATION WINDOW (Center-Left: 700px x 480px) -->
    <g transform="translate(0, 0)" class="window-glow">
      <rect width="700" height="480" fill="#0b1120" stroke="#334155" stroke-width="1.5" rx="6"/>
      
      <!-- Window Chrome -->
      <rect width="700" height="40" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="6 6 0 0"/>
      <circle cx="20" cy="20" r="4.5" fill="#f43f5e"/>
      <circle cx="36" cy="20" r="4.5" fill="#f59e0b"/>
      <circle cx="52" cy="20" r="4.5" fill="#10b981"/>
      <text x="75" y="24" class="font-sans" font-size="11px" font-weight="700" fill="#f8fafc">NORDIC OS <tspan fill="#38bdf8">· Project Hub [PRJ-204 Actuator Assembly]</tspan></text>
      <rect x="580" y="10" width="105" height="20" rx="3" fill="#1e293b"/>
      <text x="632" y="23" text-anchor="middle" class="font-sans" font-size="8.5px" font-weight="600" fill="#10b981">● SYSTEM LIVE</text>

      <!-- Internal Layout: Left Nav + Content -->
      <g transform="translate(0, 40)">
        <!-- Nav bar mini -->
        <rect width="130" height="440" fill="#070d19" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="28" class="font-sans" font-size="9.5px" font-weight="700" fill="#38bdf8">► Projects (14)</text>
        <text x="14" y="52" class="font-sans" font-size="9px" fill="#94a3b8">DAP Approvals</text>
        <text x="14" y="74" class="font-sans" font-size="9px" fill="#94a3b8">BOM Explorer</text>
        <text x="14" y="96" class="font-sans" font-size="9px" fill="#94a3b8">Procurement</text>
        <text x="14" y="118" class="font-sans" font-size="9px" fill="#94a3b8">Assembly Lines</text>
        <text x="14" y="140" class="font-sans" font-size="9px" fill="#94a3b8">People &amp; Shifts</text>

        <!-- Main Body -->
        <g transform="translate(145, 15)">
          <text x="0" y="16" class="font-sans" font-size="13px" font-weight="700" fill="#f8fafc">Hydro-Pneumatic Actuator Assembly</text>
          <text x="0" y="32" class="font-sans" font-size="9.5px" fill="#64748b">Batch 2024-Q4 · Client: Nordic Automation Systems</text>

          <!-- 3 KPI Cards -->
          <g transform="translate(0, 46)">
            <rect width="165" height="58" rx="3" fill="#0f172a" stroke="#1e293b"/>
            <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">OVERALL PROGRESS</text>
            <text x="10" y="40" class="font-sans" font-size="15px" font-weight="800" fill="#38bdf8">78.4%</text>

            <rect x="180" width="165" height="58" rx="3" fill="#0f172a" stroke="#1e293b"/>
            <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">BOM PROCURMENT</text>
            <text x="10" y="40" class="font-sans" font-size="15px" font-weight="800" fill="#10b981">42 / 45</text>

            <rect x="360" width="170" height="58" rx="3" fill="#0f172a" stroke="#1e293b"/>
            <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">ASSEMBLY CELL</text>
            <text x="10" y="40" class="font-sans" font-size="15px" font-weight="800" fill="#f59e0b">Cell 02</text>
          </g>

          <!-- Active Stage Pipeline -->
          <g transform="translate(0, 120)">
            <rect width="530" height="150" fill="#0f172a" stroke="#1e293b" rx="3"/>
            <rect width="530" height="26" fill="#1e293b" rx="3 3 0 0"/>
            <text x="12" y="17" class="font-sans" font-size="9.5px" font-weight="700" fill="#f8fafc">Active Assembly Line Telemetry (Cell 02)</text>

            <g transform="translate(12, 38)">
              <text x="0" y="14" class="font-sans" font-size="9px" fill="#cbd5e1">Step 1: Cylinder Bore Honing — <tspan fill="#10b981">Completed by M. Berg</tspan></text>
              <text x="0" y="32" class="font-sans" font-size="9.5px" font-weight="700" fill="#38bdf8">► Step 2: Piston Seal Installation — Running (S. Nilsson)</text>
              <text x="0" y="50" class="font-sans" font-size="9px" fill="#64748b">Step 3: Hydrostatic Pressure Test — Queued</text>
              <text x="0" y="68" class="font-sans" font-size="9px" fill="#64748b">Step 4: Quality Sign-Off &amp; Packaging — Queued</text>

              <rect y="80" width="506" height="20" rx="3" fill="#111e38" stroke="#38bdf8"/>
              <text x="12" y="94" class="font-sans" font-size="8.5px" fill="#38bdf8">✓ DAP Compliance Check: Verified | Torque Calibrated</text>
            </g>
          </g>

          <!-- System Status Bar -->
          <g transform="translate(0, 285)">
            <rect width="530" height="50" fill="#070d19" stroke="#1e293b" rx="3"/>
            <text x="12" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#94a3b8">Internal Operations Connected Stack:</text>
            <text x="12" y="36" class="font-sans" font-size="8.5px" fill="#f8fafc">1 Relational PostgreSQL Database · Real-Time WebSockets · 0px Modular Design System · 6 Modules</text>
          </g>
        </g>
      </g>
    </g>

    <!-- FLOATING DEVICE OVERLAY (Right: Shop Floor Tablet HMI - 360px x 440px) -->
    <g transform="translate(720, 30)" class="window-glow">
      <!-- Tablet Bezel (Industrial Rugged Tablet Frame) -->
      <rect width="360" height="440" fill="#182234" stroke="#38bdf8" stroke-width="2" rx="10"/>
      <rect x="8" y="8" width="344" height="424" fill="#0b1120" rx="6"/>
      
      <!-- Tablet Top -->
      <rect x="8" y="8" width="344" height="34" fill="#059669" rx="6 6 0 0"/>
      <text x="24" y="29" class="font-sans" font-size="10.5px" font-weight="800" fill="#ffffff">SHOP FLOOR HMI · CELL 02</text>
      <text x="270" y="29" class="font-sans" font-size="9px" font-weight="600" fill="#d1fae5">GLOVES ON</text>

      <g transform="translate(24, 56)">
        <text x="0" y="14" class="font-sans" font-size="10px" font-weight="700" fill="#94a3b8">ACTIVE WORK ORDER: #WO-402</text>
        <text x="0" y="34" class="font-sans" font-size="14px" font-weight="800" fill="#f8fafc">Install Piston Seal</text>
        <text x="0" y="50" class="font-sans" font-size="9.5px" fill="#cbd5e1">Part: Viton Seal Ring (SKU: SEAL-O-12)</text>

        <!-- Big 44px Rugged Touch Button -->
        <rect y="64" width="312" height="52" rx="4" fill="#38bdf8"/>
        <text x="156" y="95" text-anchor="middle" class="font-sans" font-size="13px" font-weight="800" fill="#070d19">SIGN-OFF STEP 2 [TORQUE OK]</text>

        <!-- Work Instructions -->
        <rect y="128" width="312" height="120" rx="3" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="22" class="font-sans" font-size="9.5px" font-weight="700" fill="#f8fafc">Work Instruction Spec:</text>
        <text x="12" y="40" class="font-sans" font-size="8.8px" fill="#94a3b8">1. Verify cylinder interior clean of debris</text>
        <text x="12" y="56" class="font-sans" font-size="8.8px" fill="#94a3b8">2. Lubricate seal ring with Krytox grease</text>
        <text x="12" y="72" class="font-sans" font-size="8.8px" fill="#94a3b8">3. Torque collar to 45.0 Nm (±0.5 Nm)</text>
        <text x="12" y="95" class="font-sans" font-size="8.5px" font-weight="600" fill="#10b981">✓ Calibration Certificate #CAL-901 Active</text>

        <!-- Operator Badge -->
        <g transform="translate(0, 260)">
          <rect width="312" height="42" rx="3" fill="#1e293b"/>
          <circle cx="20" cy="21" r="10" fill="#059669"/>
          <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="9px" font-weight="800" fill="#fff">SN</text>
          <text x="40" y="18" class="font-sans" font-size="9.5px" font-weight="700" fill="#f8fafc">Technician: S. Nilsson</text>
          <text x="40" y="32" class="font-sans" font-size="8.5px" fill="#10b981">Certified: High-Pressure Hydro Systems</text>
        </g>
      </g>
    </g>

  </g>
</svg>

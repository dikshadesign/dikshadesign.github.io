<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3440"/>
      <stop offset="50%" stop-color="#1e242e"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>
    <pattern id="isoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#263140" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#0f131a"/>
  <rect width="800" height="500" fill="url(#isoGrid)"/>

  <!-- Technical Drawing Border & Title Block -->
  <rect x="30" y="30" width="740" height="440" fill="none" stroke="#253043" stroke-width="1.5"/>
  <rect x="520" y="390" width="250" height="80" fill="#141923" stroke="#253043" stroke-width="1"/>
  <text x="535" y="412" font-family="'SF Mono', monospace" font-size="10" fill="#38bdf8" font-weight="700">CAD FORM STUDY // DS-ERGO-04</text>
  <text x="535" y="430" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">Handheld Scanner Grip &amp; Reach Envelope</text>
  <text x="535" y="448" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Scale: 1:1 · Units: mm · NID MP Workshop</text>
  <text x="535" y="462" font-family="'Inter', sans-serif" font-size="9.5" fill="#10b981">Material: High-Density Urethane + TPU</text>

  <!-- Left Side: Anthropometric Hand Overlay -->
  <g transform="translate(80, 80)">
    <!-- Reach Envelope Arcs -->
    <path d="M 120 180 A 140 140 0 0 1 290 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>
    <text x="210" y="70" font-family="'SF Mono', monospace" font-size="10" fill="#38bdf8">95th %ILE THUMB REACH (R=142mm)</text>

    <!-- Scanner Handle Form (Profile View) -->
    <!-- Main Handle Body -->
    <path d="M 140 120 C 180 120, 210 135, 230 170 C 245 195, 250 250, 240 290 C 235 315, 205 340, 160 340 C 130 340, 105 325, 95 300 C 80 260, 85 190, 110 140 C 120 125, 130 120, 140 120 Z" fill="url(#foamGrad)" stroke="#455ea9" stroke-width="2"/>

    <!-- Index Finger Trigger Indentation -->
    <path d="M 230 170 C 240 185, 242 205, 230 220" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="250" y="200" font-family="'SF Mono', monospace" font-size="9.5" fill="#f59e0b">TRIGGER PIVOT [18N]</text>

    <!-- Textured TPU Grip Zone -->
    <path d="M 100 210 C 105 240, 115 270, 125 290" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 108 215 C 113 245, 123 275, 133 295" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 116 220 C 121 250, 131 280, 141 300" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="50" y="260" font-family="'SF Mono', monospace" font-size="9.5" fill="#38bdf8" text-anchor="end">TEXTURED TPU</text>
    <line x1="55" y1="256" x2="98" y2="256" stroke="#38bdf8" stroke-width="1"/>

    <!-- Center of Gravity Marker -->
    <circle cx="165" cy="230" r="10" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="165" y1="215" x2="165" y2="245" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="150" y1="230" x2="180" y2="230" stroke="#ef4444" stroke-width="1.5"/>
    <text x="180" y="226" font-family="'SF Mono', monospace" font-size="9.5" fill="#ef4444">BALANCED COG</text>

    <!-- Dimension Callouts -->
    <line x1="140" y1="360" x2="235" y2="360" stroke="#64748b" stroke-width="1"/>
    <line x1="140" y1="355" x2="140" y2="365" stroke="#64748b" stroke-width="1"/>
    <line x1="235" y1="355" x2="235" y2="365" stroke="#64748b" stroke-width="1"/>
    <text x="187" y="375" font-family="'SF Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">GRIP DIA: 42.5mm</text>
  </g>

  <!-- Right Side: Foam & 3D Print Iterations Matrix -->
  <g transform="translate(460, 70)">
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">RAPID PHYSICAL MOCKUPS (ITERATION MATRIX)</text>

    <!-- Iteration V1 -->
    <rect x="0" y="38" width="280" height="85" fill="#141923" stroke="#253043" stroke-width="1"/>
    <circle cx="36" cy="80" r="20" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="36" y="84" font-family="'SF Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">v0.1</text>
    <text x="72" y="66" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Blue Styling Foam Model</text>
    <text x="72" y="84" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Hand-carved with hot-wire &amp; rasp to test</text>
    <text x="72" y="98" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">basic palm arch. Palm fatigue noticed after 15m.</text>

    <!-- Iteration V2 -->
    <rect x="0" y="135" width="280" height="85" fill="#141923" stroke="#253043" stroke-width="1"/>
    <circle cx="36" cy="177" r="20" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="36" y="181" font-family="'SF Mono', monospace" font-size="11" fill="#f59e0b" text-anchor="middle">v0.2</text>
    <text x="72" y="163" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">FDM 3D Print (PLA)</text>
    <text x="72" y="181" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Adjusted rake angle to 17°. Added internal</text>
    <text x="72" y="195" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">lead ballast weights to simulate battery pack.</text>

    <!-- Iteration V3 (Final) -->
    <rect x="0" y="232" width="280" height="85" fill="#141923" stroke="#10b981" stroke-width="1"/>
    <circle cx="36" cy="274" r="20" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="36" y="278" font-family="'SF Mono', monospace" font-size="11" fill="#34d399" text-anchor="middle">v0.3</text>
    <text x="72" y="260" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399">Dual-Shot SLA Resin + TPU</text>
    <text x="72" y="278" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Overmolded diamond knurling. Passed 8-hour</text>
    <text x="72" y="292" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">continuous shop-floor user ergonomics test.</text>
  </g>
</svg>

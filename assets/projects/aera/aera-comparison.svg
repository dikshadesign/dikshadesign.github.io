<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; }
      .card-before { fill: #ffffff; stroke: #fca5a5; stroke-width: 1.5; rx: 4; }
      .card-after { fill: #ffffff; stroke: #86efac; stroke-width: 1.5; rx: 4; }
      .tag-before { fill: #fee2e2; stroke: #f87171; rx: 10; }
      .tag-after { fill: #f0fdf4; stroke: #4ade80; rx: 10; }
      .tag-text-before { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9.5px; font-weight: 700; fill: #dc2626; letter-spacing: 0.08em; }
      .tag-text-after { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9.5px; font-weight: 700; fill: #16a34a; letter-spacing: 0.08em; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .bullet-title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 700; fill: #1e293b; }
      .bullet-desc { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11px; fill: #475569; line-height: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="440" class="bg"/>

  <!-- Top Title Banner -->
  <rect x="40" y="25" width="1120" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="64" y="52" class="header-title">AERA · System Transformation Comparison</text>
  <text x="740" y="52" class="header-sub">From an isolated floor appliance to an architecturally connected system</text>

  <!-- Left Card: Starting Point (Standalone Purifier) -->
  <g transform="translate(40, 85)">
    <rect width="545" height="325" class="card-before"/>
    <rect x="20" y="16" width="160" height="22" class="tag-before"/>
    <text x="100" y="31" text-anchor="middle" class="tag-text-before">THE STARTING POINT</text>
    <text x="20" y="65" class="title">Conventional Floor-Standing Appliance</text>

    <!-- Visual Box -->
    <g transform="translate(20, 80)">
      <rect width="505" height="100" fill="#fef2f2" stroke="#fecaca" rx="3"/>
      <!-- Illustration of room with single corner unit -->
      <rect x="30" y="15" width="200" height="70" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="2 2"/>
      <circle cx="50" cy="65" r="10" fill="#ef4444"/>
      <circle cx="50" cy="65" r="30" fill="none" stroke="#ef4444" opacity="0.3"/>
      <!-- Dead zone -->
      <text x="140" y="55" font-family="Inter, sans-serif" font-size="9px" fill="#ef4444" font-weight="700">65% Dead Air Zone</text>
      <!-- Metric callouts -->
      <text x="250" y="35" font-family="Inter, sans-serif" font-size="11px" font-weight="700" fill="#dc2626">Noise: 54 dBA (Audible Motor Hum)</text>
      <text x="250" y="55" font-family="Inter, sans-serif" font-size="11px" font-weight="700" fill="#dc2626">Coverage: Single Point (Drop-off > 3m)</text>
      <text x="250" y="75" font-family="Inter, sans-serif" font-size="11px" font-weight="700" fill="#dc2626">Floor Clutter: Trailing power cables</text>
    </g>

    <!-- Key Points -->
    <g transform="translate(20, 200)">
      <text x="0" y="14" class="bullet-title">• Isolated Appliance Logic</text>
      <text x="0" y="32" class="bullet-desc">Treated as a standalone object placed opportunistically near electrical wall outlets.</text>

      <text x="0" y="62" class="bullet-title">• Maintenance Blindspots</text>
      <text x="0" y="80" class="bullet-desc">Filters operate unseen until completely clogged; no digital facility notifications.</text>
    </g>
  </g>

  <!-- Right Card: Design Response (AERA System) -->
  <g transform="translate(615, 85)">
    <rect width="545" height="325" class="card-after"/>
    <rect x="20" y="16" width="160" height="22" class="tag-after"/>
    <text x="100" y="31" text-anchor="middle" class="tag-text-after">THE DESIGN RESPONSE</text>
    <text x="20" y="65" class="title">AERA Distributed Ceiling System</text>

    <!-- Visual Box -->
    <g transform="translate(20, 80)">
      <rect width="505" height="100" fill="#f0fdf4" stroke="#bbf7d0" rx="3"/>
      <!-- Illustration of room with 4 distributed ceiling units -->
      <rect x="30" y="15" width="200" height="70" fill="#ffffff" stroke="#86efac" stroke-dasharray="2 2"/>
      <circle cx="65" cy="35" r="6" fill="#10b981"/><circle cx="65" cy="35" r="22" fill="none" stroke="#10b981" opacity="0.3"/>
      <circle cx="160" cy="35" r="6" fill="#10b981"/><circle cx="160" cy="35" r="22" fill="none" stroke="#10b981" opacity="0.3"/>
      <circle cx="65" cy="70" r="6" fill="#10b981"/><circle cx="65" cy="70" r="22" fill="none" stroke="#10b981" opacity="0.3"/>
      <circle cx="160" cy="70" r="6" fill="#10b981"/><circle cx="160" cy="70" r="22" fill="none" stroke="#10b981" opacity="0.3"/>
      
      <text x="250" y="35" font-family="Inter, sans-serif" font-size="11px" font-weight="700" fill="#16a34a">Noise: 31 dBA (Background Silent)</text>
      <text x="250" y="55" font-family="Inter, sans-serif" font-size="11px" font-weight="700" fill="#16a34a">Coverage: Uniform Radial Air Curtain</text>
      <text x="250" y="75" font-family="Inter, sans-serif" font-size="11px" font-weight="700" fill="#16a34a">Zero Floor Footprint: Ceiling integrated</text>
    </g>

    <g transform="translate(20, 200)">
      <text x="0" y="14" class="bullet-title">• Connected Spatial Environment</text>
      <text x="0" y="32" class="bullet-desc">Units communicate via local wireless mesh, automatically adapting fan speeds to occupancy.</text>

      <text x="0" y="62" class="bullet-title">• Scheduled Proactive Maintenance</text>
      <text x="0" y="80" class="bullet-desc">Pressure sensors alert technicians with exact room location and tool-free quick-swap.</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11px; fill: #94a3b8; }
      .part-outline { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.8; }
      .part-filter { fill: #334155; stroke: #818cf8; stroke-width: 1.5; stroke-dasharray: 2 2; }
      .part-metal { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.5; }
      .airflow-arrow { stroke: #38bdf8; stroke-width: 2.5; fill: none; stroke-dasharray: 5 4; }
      .callout-line { stroke: #64748b; stroke-width: 1.2; }
      .callout-title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #f1f5f9; }
      .callout-desc { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 10px; fill: #94a3b8; line-height: 1.4; }
      .badge { fill: rgba(56, 189, 248, 0.15); stroke: #38bdf8; stroke-width: 1; rx: 3; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="620" class="bg"/>

  <!-- Blueprint Grid -->
  <g class="grid">
    <line x1="50" y1="50" x2="1150" y2="50"/><line x1="50" y1="150" x2="1150" y2="150"/>
    <line x1="50" y1="250" x2="1150" y2="250"/><line x1="50" y1="350" x2="1150" y2="350"/>
    <line x1="50" y1="450" x2="1150" y2="450"/><line x1="50" y1="550" x2="1150" y2="550"/>
    <line x1="150" y1="50" x2="150" y2="550"/><line x1="300" y1="50" x2="300" y2="550"/>
    <line x1="450" y1="50" x2="450" y2="550"/><line x1="600" y1="50" x2="600" y2="550"/>
    <line x1="750" y1="50" x2="750" y2="550"/><line x1="900" y1="50" x2="900" y2="550"/>
    <line x1="1050" y1="50" x2="1050" y2="550"/>
  </g>

  <!-- Top Title Banner -->
  <text x="60" y="55" class="header-title">AERA · Exploded Hardware Architecture &amp; Component Packaging</text>
  <text x="60" y="75" class="header-sub">Axial-intake centrifugal radial diffusion assembly · Compact Ø200 mm ceiling module (600 × 600 mm grid fit)</text>

  <!-- Central Exploded Assembly Axis Line -->
  <line x1="600" y1="100" x2="600" y2="540" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Component 01: Ceiling Mounting Flange & Plenum Bracket -->
  <g transform="translate(600, 120)">
    <polygon points="-160,-20 160,-20 220,10 -220,10" fill="#1e293b" stroke="#64748b" stroke-width="1.8"/>
    <rect x="-140" y="-15" width="280" height="20" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="-130" cy="-5" r="4" fill="#38bdf8"/>
    <circle cx="130" cy="-5" r="4" fill="#38bdf8"/>
  </g>
  <!-- Callout 01 (Left) -->
  <line x1="400" y1="120" x2="250" y2="120" class="callout-line"/>
  <rect x="60" y="98" width="180" height="48" class="badge"/>
  <text x="75" y="118" class="callout-title">01 / Ceiling Mount Flange</text>
  <text x="75" y="134" class="callout-desc">600 × 600 mm drop-in T-bar fit</text>

  <!-- Component 02: Die-Cast Aluminum Enclosure & IoT PCB -->
  <g transform="translate(600, 185)">
    <polygon points="-130,-15 130,-15 170,15 -170,15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-60" y="-5" width="120" height="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="0" y="6" text-anchor="middle" font-size="8px" fill="#818cf8" font-family="monospace">IoT Telemetry &amp; Laser AQ Sensors</text>
  </g>
  <!-- Callout 02 (Right) -->
  <line x1="770" y1="185" x2="920" y2="185" class="callout-line"/>
  <rect x="930" y="162" width="210" height="48" class="badge"/>
  <text x="945" y="182" class="callout-title">02 / Controller &amp; Sensor Hub</text>
  <text x="945" y="198" class="callout-desc">Integrated laser PM2.5, CO2 &amp; TVOC</text>

  <!-- Component 03: Centrifugal Blower Motor (Acoustic Baffled) -->
  <g transform="translate(600, 260)">
    <ellipse cx="0" cy="0" rx="100" ry="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="0" cy="-6" rx="80" ry="18" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="-6" r="30" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Rotor blades -->
    <path d="M -20 -6 Q -10 -20 0 -6 Q 10 10 20 -6" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  </g>
  <!-- Callout 03 (Left) -->
  <line x1="500" y1="260" x2="320" y2="260" class="callout-line"/>
  <rect x="130" y="238" width="180" height="48" class="badge"/>
  <text x="145" y="258" class="callout-title">03 / Backward-Curved Fan</text>
  <text x="145" y="274" class="callout-desc">Ultra-quiet brushless motor &lt; 32 dBA</text>

  <!-- Component 04: Cylindrical HEPA H13 + Carbon Filter Cartridge -->
  <g transform="translate(600, 350)">
    <ellipse cx="0" cy="-22" rx="115" ry="26" fill="#334155" stroke="#818cf8" stroke-width="2"/>
    <!-- Cylinder body -->
    <path d="M -115 -22 L -115 22 A 115 26 0 0 0 115 22 L 115 -22" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <!-- Pleats texture -->
    <line x1="-80" y1="-10" x2="-80" y2="30" stroke="#475569" stroke-width="1.5"/>
    <line x1="-50" y1="-5" x2="-50" y2="35" stroke="#475569" stroke-width="1.5"/>
    <line x1="-20" y1="-2" x2="-20" y2="38" stroke="#475569" stroke-width="1.5"/>
    <line x1="10" y1="0" x2="10" y2="40" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="-2" x2="40" y2="38" stroke="#475569" stroke-width="1.5"/>
    <line x1="70" y1="-5" x2="70" y2="35" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="0" cy="22" rx="115" ry="26" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="10" text-anchor="middle" font-size="10px" font-weight="700" fill="#a5b4fc" letter-spacing="0.1em">TRUE HEPA H13 + ACTIVATED CARBON</text>
  </g>
  <!-- Callout 04 (Right) -->
  <line x1="720" y1="350" x2="900" y2="350" class="callout-line"/>
  <rect x="910" y="328" width="245" height="48" class="badge"/>
  <text x="925" y="348" class="callout-title">04 / Filter Cartridge (Ø180 × 250 mm)</text>
  <text x="925" y="364" class="callout-desc">True HEPA H13 · 175 m³/h target CADR</text>

  <!-- Component 05: Quarter-Turn Magnetic Quick-Release Mechanism -->
  <g transform="translate(600, 440)">
    <ellipse cx="0" cy="0" rx="95" ry="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="-50" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="50" cy="0" r="6" fill="#f59e0b"/>
    <text x="0" y="4" text-anchor="middle" font-size="9px" font-weight="700" fill="#fbbf24">NEODYMIUM MAGNETIC LATCH</text>
  </g>
  <!-- Callout 05 (Left) -->
  <line x1="500" y1="440" x2="300" y2="440" class="callout-line"/>
  <rect x="110" y="418" width="180" height="48" class="badge" stroke="#f59e0b"/>
  <text x="125" y="438" class="callout-title" fill="#fbbf24">05 / Tool-Free Quick Release</text>
  <text x="125" y="454" class="callout-desc">Filter swap under 30 seconds</text>

  <!-- Component 06: Underside Louvered Diffuser with Ambient LED Status Ring -->
  <g transform="translate(600, 520)">
    <polygon points="-150,-15 150,-15 190,15 -190,15" fill="#1e293b" stroke="#38bdf8" stroke-width="2.2"/>
    <ellipse cx="0" cy="0" rx="105" ry="18" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
    <!-- Louvers -->
    <ellipse cx="0" cy="0" rx="85" ry="14" fill="none" stroke="#64748b" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="60" ry="10" fill="none" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="15" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <!-- Callout 06 (Right) -->
  <line x1="790" y1="520" x2="920" y2="520" class="callout-line"/>
  <rect x="930" y="498" width="210" height="48" class="badge" stroke="#34d399"/>
  <text x="945" y="518" class="callout-title" fill="#34d399">06 / Radial Diffuser &amp; LED Ring</text>
  <text x="945" y="534" class="callout-desc">Soft ambient air quality status ring</text>

  <!-- Downward Airflow Streamlines -->
  <path d="M 500 535 Q 460 565 420 585" class="airflow-arrow"/>
  <path d="M 700 535 Q 740 565 780 585" class="airflow-arrow"/>
  <path d="M 600 540 L 600 590" class="airflow-arrow"/>
</svg>

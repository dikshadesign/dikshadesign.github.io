<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .before-box { fill: #ffffff; stroke: #fca5a5; stroke-width: 1.5; rx: 4; }
      .after-box { fill: #ffffff; stroke: #86efac; stroke-width: 1.5; rx: 4; }
      .silo-card { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1; rx: 3; }
      .unified-shell { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 4; }
      .app-pill { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 3; }
      .bus-line { stroke: #10b981; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
      .silo-disconnect { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="480" class="bg"/>

  <!-- Top Banner -->
  <rect x="40" y="20" width="1120" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="60" y="45" class="font-sans" font-size="13px" font-weight="700" fill="#0f172a">Section 03 · Architectural Comparison: Fragmented Silos vs. Unified Platform &amp; Integration</text>
  <text x="730" y="45" class="font-sans" font-size="10.5px" fill="#64748b">Distinguishing shared access (platform shell) from data &amp; workflow integration</text>

  <!-- LEFT: BEFORE (Isolated Applications) -->
  <g transform="translate(40, 76)">
    <rect width="545" height="375" class="before-box"/>
    
    <!-- Header -->
    <rect width="545" height="38" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="4 4 0 0"/>
    <text x="20" y="24" class="font-sans" font-size="12px" font-weight="800" fill="#991b1b">BEFORE · FRAGMENTED &amp; ISOLATED SYSTEMS</text>
    <text x="370" y="24" class="font-sans" font-size="10px" font-weight="600" fill="#dc2626">5 Disconnected Logins &amp; Databases</text>

    <!-- Disconnected Silos -->
    <g transform="translate(20, 55)">
      <!-- Silo 1: Vision -->
      <g transform="translate(0, 0)">
        <rect width="155" height="110" class="silo-card"/>
        <text x="12" y="22" class="font-sans" font-size="11px" font-weight="700" fill="#991b1b">Nordic Vision</text>
        <text x="12" y="38" class="font-sans" font-size="8.5px" fill="#64748b">Isolated Camera DB</text>
        <rect x="12" y="52" width="131" height="20" rx="2" fill="#ffffff" stroke="#fecdd3"/>
        <text x="18" y="65" class="font-sans" font-size="8px" fill="#ef4444">Separate Auth / Login</text>
        <text x="12" y="96" class="font-sans" font-size="8px" fill="#991b1b">Manual export to CSV</text>
      </g>

      <!-- Silo 2: ERP -->
      <g transform="translate(175, 0)">
        <rect width="155" height="110" class="silo-card"/>
        <text x="12" y="22" class="font-sans" font-size="11px" font-weight="700" fill="#991b1b">Nordic ERP</text>
        <text x="12" y="38" class="font-sans" font-size="8.5px" fill="#64748b">Procurement &amp; Finance</text>
        <rect x="12" y="52" width="131" height="20" rx="2" fill="#ffffff" stroke="#fecdd3"/>
        <text x="18" y="65" class="font-sans" font-size="8px" fill="#ef4444">Separate Credentials</text>
        <text x="12" y="96" class="font-sans" font-size="8px" fill="#991b1b">Delayed batch records</text>
      </g>

      <!-- Silo 3: MES -->
      <g transform="translate(350, 0)">
        <rect width="155" height="110" class="silo-card"/>
        <text x="12" y="22" class="font-sans" font-size="11px" font-weight="700" fill="#991b1b">Nordic MES</text>
        <text x="12" y="38" class="font-sans" font-size="8.5px" fill="#64748b">Shop Floor Terminal</text>
        <rect x="12" y="52" width="131" height="20" rx="2" fill="#ffffff" stroke="#fecdd3"/>
        <text x="18" y="65" class="font-sans" font-size="8px" fill="#ef4444">Local Plant Login</text>
        <text x="12" y="96" class="font-sans" font-size="8px" fill="#991b1b">Paper travel sheets</text>
      </g>

      <!-- Disconnect Red Crosses between Silos -->
      <line x1="160" y1="55" x2="170" y2="55" stroke="#ef4444" stroke-width="2"/>
      <text x="165" y="48" text-anchor="middle" font-size="11px" fill="#ef4444">✕</text>

      <line x1="335" y1="55" x2="345" y2="55" stroke="#ef4444" stroke-width="2"/>
      <text x="340" y="48" text-anchor="middle" font-size="11px" fill="#ef4444">✕</text>

      <!-- Silo 4 & 5 Below -->
      <g transform="translate(85, 125)">
        <rect width="155" height="95" class="silo-card"/>
        <text x="12" y="22" class="font-sans" font-size="11px" font-weight="700" fill="#991b1b">Nordic EQMS</text>
        <text x="12" y="38" class="font-sans" font-size="8.5px" fill="#64748b">Quality Audit Silo</text>
        <text x="12" y="70" class="font-sans" font-size="8px" fill="#991b1b">Manual defect re-entry</text>
      </g>

      <g transform="translate(265, 125)">
        <rect width="155" height="95" class="silo-card"/>
        <text x="12" y="22" class="font-sans" font-size="11px" font-weight="700" fill="#991b1b">Visitor Access</text>
        <text x="12" y="38" class="font-sans" font-size="8.5px" fill="#64748b">Front Gate Logbook</text>
        <text x="12" y="70" class="font-sans" font-size="8px" fill="#991b1b">Zero factory integration</text>
      </g>
    </g>

    <!-- Operational Consequence Callout -->
    <rect x="20" y="295" width="505" height="65" fill="#fef2f2" stroke="#f87171" stroke-width="1" rx="3"/>
    <text x="32" y="315" class="font-sans" font-size="10.5px" font-weight="700" fill="#991b1b">The Operational Friction:</text>
    <text x="32" y="332" class="font-sans" font-size="9.5px" fill="#7f1d1d">Operators juggle multiple logins, transcribe numbers manually between tools, and lack global visibility. Discrepancies take hours to reconcile.</text>
  </g>

  <!-- RIGHT: AFTER (Nordic ONE Unified Platform) -->
  <g transform="translate(615, 76)">
    <rect width="545" height="375" class="after-box"/>
    
    <!-- Header -->
    <rect width="545" height="38" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="4 4 0 0"/>
    <text x="20" y="24" class="font-sans" font-size="12px" font-weight="800" fill="#166534">AFTER · UNIFIED PLATFORM &amp; WORKFLOW CONTINUITY</text>
    <text x="360" y="24" class="font-sans" font-size="10px" font-weight="600" fill="#15803d">1 Platform · Shared Access + Event Bus</text>

    <!-- TIER 1: Unified Access Shell (Blue bar) -->
    <g transform="translate(20, 50)">
      <rect width="505" height="52" class="unified-shell"/>
      <rect x="12" y="12" width="26" height="26" rx="3" fill="#38bdf8"/>
      <polygon points="25,18 31,30 19,30" fill="#0f172a"/>
      <text x="48" y="28" class="font-sans" font-size="12px" font-weight="800" fill="#ffffff">NORDIC <tspan fill="#38bdf8">ONE</tspan> PLATFORM SHELL</text>
      <text x="48" y="44" class="font-sans" font-size="9px" fill="#94a3b8">LEVEL 1: UNIFIED ACCESS — Single Sign-On (SSO) · ⌘K Search · Global Launcher</text>
      <rect x="420" y="14" width="75" height="22" rx="3" fill="#10b981"/>
      <text x="457" y="28" text-anchor="middle" class="font-sans" font-size="9px" font-weight="700" fill="#ffffff">1 AUTH TOKEN</text>
    </g>

    <!-- TIER 2: 5 Micro-Apps inside the platform -->
    <g transform="translate(20, 115)">
      <!-- 5 App Nodes -->
      <g transform="translate(0, 0)">
        <rect width="95" height="75" class="app-pill"/>
        <text x="47" y="22" text-anchor="middle" class="font-sans" font-size="9.5px" font-weight="700" fill="#38bdf8">VISION</text>
        <text x="47" y="38" text-anchor="middle" class="font-sans" font-size="8px" fill="#cbd5e1">Optical AI</text>
        <text x="47" y="55" text-anchor="middle" class="font-sans" font-size="7.5px" fill="#10b981">● Connected</text>
      </g>

      <g transform="translate(102, 0)">
        <rect width="95" height="75" class="app-pill"/>
        <text x="47" y="22" text-anchor="middle" class="font-sans" font-size="9.5px" font-weight="700" fill="#818cf8">ERP</text>
        <text x="47" y="38" text-anchor="middle" class="font-sans" font-size="8px" fill="#cbd5e1">Planning</text>
        <text x="47" y="55" text-anchor="middle" class="font-sans" font-size="7.5px" fill="#10b981">● Connected</text>
      </g>

      <g transform="translate(204, 0)">
        <rect width="95" height="75" class="app-pill"/>
        <text x="47" y="22" text-anchor="middle" class="font-sans" font-size="9.5px" font-weight="700" fill="#34d399">MES</text>
        <text x="47" y="38" text-anchor="middle" class="font-sans" font-size="8px" fill="#cbd5e1">Shop Floor</text>
        <text x="47" y="55" text-anchor="middle" class="font-sans" font-size="7.5px" fill="#10b981">● Connected</text>
      </g>

      <g transform="translate(306, 0)">
        <rect width="95" height="75" class="app-pill"/>
        <text x="47" y="22" text-anchor="middle" class="font-sans" font-size="9.5px" font-weight="700" fill="#fbbf24">EQMS</text>
        <text x="47" y="38" text-anchor="middle" class="font-sans" font-size="8px" fill="#cbd5e1">Quality</text>
        <text x="47" y="55" text-anchor="middle" class="font-sans" font-size="7.5px" fill="#10b981">● Connected</text>
      </g>

      <g transform="translate(408, 0)">
        <rect width="97" height="75" class="app-pill"/>
        <text x="48" y="22" text-anchor="middle" class="font-sans" font-size="9.5px" font-weight="700" fill="#c084fc">VISITOR</text>
        <text x="48" y="38" text-anchor="middle" class="font-sans" font-size="8px" fill="#cbd5e1">Security</text>
        <text x="48" y="55" text-anchor="middle" class="font-sans" font-size="7.5px" fill="#10b981">● Connected</text>
      </g>
    </g>

    <!-- TIER 3: Data & Event Bus Integration (Level 2) -->
    <g transform="translate(20, 202)">
      <rect width="505" height="78" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="3"/>
      <text x="16" y="20" class="font-sans" font-size="10.5px" font-weight="700" fill="#166534">LEVEL 2: DATA &amp; WORKFLOW INTEGRATION (THE EVENT BUS)</text>
      <text x="16" y="36" class="font-sans" font-size="9px" fill="#15803d">Cross-application data continuity: Inspection defect events emit real-time signals to EQMS tickets and MES CNC halts without operator copy-pasting.</text>
      
      <!-- Flow markers -->
      <g transform="translate(16, 46)">
        <text x="0" y="14" class="font-sans" font-size="8.5px" font-weight="600" fill="#0369a1">Vision Defect ──→</text>
        <text x="110" y="14" class="font-sans" font-size="8.5px" font-weight="600" fill="#b45309">EQMS Auto-Ticket ──→</text>
        <text x="240" y="14" class="font-sans" font-size="8.5px" font-weight="600" fill="#15803d">MES Line Halt ──→</text>
        <text x="360" y="14" class="font-sans" font-size="8.5px" font-weight="600" fill="#4338ca">ERP Quarantine</text>
      </g>
    </g>

    <!-- Summary Box -->
    <rect x="20" y="295" width="505" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3"/>
    <text x="32" y="315" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">The Value Delivered:</text>
    <text x="32" y="332" class="font-sans" font-size="9.5px" fill="#475569">Unifying access provides a common mental model and instant navigation. Integrating workflows eliminates data silos and coordinates the physical plant in real time.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #24324f; stroke-width: 1.2; rx: 6; }
      .card-sub { fill: #0a0f1d; stroke: #1e293b; stroke-width: 1; rx: 4; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .section-label { font-family: "Inter", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
      .title-text { font-family: "Inter", sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .body-text { font-family: "Inter", sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.5; }
      .phone-frame { fill: #090e1a; stroke: #334155; stroke-width: 2; rx: 18; }
      .phone-screen { fill: #0f172a; rx: 12; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="560" class="bg"/>

  <!-- Top Title Strip -->
  <g transform="translate(40, 30)">
    <text x="0" y="16" class="font-sans" font-size="16px" font-weight="700" fill="#f8fafc">Pre-Arrival Software Surfaces: Employee Host Portal vs. Visitor Mobile Web</text>
    <text x="0" y="36" class="font-sans" font-size="12px" fill="#64748b">How internal hosts invite guests with automated guardrails, while external visitors complete requirements before arrival.</text>
  </g>

  <!-- ============================================================== -->
  <!-- LEFT: HOST PORTAL (DESKTOP WEB) - 620px Width                  -->
  <!-- ============================================================== -->
  <g transform="translate(40, 90)">
    <rect width="630" height="430" class="card"/>

    <!-- Header -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="105" height="20" rx="3" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7"/>
      <text x="52" y="14" text-anchor="middle" class="font-sans section-label" fill="#c084fc">ROLE 01 · EMPLOYEE</text>
      <text x="0" y="46" class="title-text">Host Pre-Registration Dashboard</text>
      <text x="0" y="64" class="body-text">Internal staff configure arrival windows, assign plant security zones, and enforce legal compliance.</text>
    </g>

    <!-- Modal Mockup Inside Host Portal -->
    <g transform="translate(24, 96)">
      <rect width="582" height="308" class="card-sub"/>

      <!-- Window Bar -->
      <path d="M 0 4 Q 0 0 4 0 L 578 0 Q 582 0 582 4 L 582 34 L 0 34 Z" fill="#131c31"/>
      <circle cx="16" cy="17" r="4" fill="#ef4444"/>
      <circle cx="28" cy="17" r="4" fill="#f59e0b"/>
      <circle cx="40" cy="17" r="4" fill="#10b981"/>
      <text x="60" y="21" class="font-sans" font-size="11.5px" font-weight="600" fill="#f1f5f9">Invite External Visitor — Step 1 of 2</text>

      <!-- Form Grid -->
      <g transform="translate(20, 48)">
        <!-- Row 1: Name and Email -->
        <g transform="translate(0, 0)">
          <text x="0" y="10" class="font-sans" font-size="10px" font-weight="600" fill="#64748b">VISITOR FULL NAME</text>
          <rect x="0" y="16" width="260" height="30" rx="3" fill="#0b1120" stroke="#334155"/>
          <text x="12" y="35" class="font-sans" font-size="11px" fill="#f8fafc">Marcus Vance</text>
        </g>
        <g transform="translate(282, 0)">
          <text x="0" y="10" class="font-sans" font-size="10px" font-weight="600" fill="#64748b">ORGANIZATION / COMPANY</text>
          <rect x="0" y="16" width="260" height="30" rx="3" fill="#0b1120" stroke="#334155"/>
          <text x="12" y="35" class="font-sans" font-size="11px" fill="#cbd5e1">Apex Tooling GmbH</text>
        </g>

        <!-- Row 2: Host Zone and Date -->
        <g transform="translate(0, 60)">
          <text x="0" y="10" class="font-sans" font-size="10px" font-weight="600" fill="#64748b">PLANT ACCESS ZONE</text>
          <rect x="0" y="16" width="260" height="30" rx="3" fill="#0b1120" stroke="#8b5cf6" stroke-width="1.2"/>
          <text x="12" y="35" class="font-sans" font-size="11px" font-weight="600" fill="#c084fc">CNC Bay 04 (Restricted Machine Line)</text>
        </g>
        <g transform="translate(282, 60)">
          <text x="0" y="10" class="font-sans" font-size="10px" font-weight="600" fill="#64748b">ARRIVAL DATE &amp; TIME</text>
          <rect x="0" y="16" width="260" height="30" rx="3" fill="#0b1120" stroke="#334155"/>
          <text x="12" y="35" class="font-sans" font-size="11px" fill="#cbd5e1">Nov 24, 2026 · 14:00 - 18:00</text>
        </g>

        <!-- Row 3: Guardrail Prerequisites -->
        <g transform="translate(0, 120)">
          <text x="0" y="10" class="font-sans" font-size="10px" font-weight="600" fill="#64748b">MANDATORY VISITOR REQUIREMENTS (PRE-ARRIVAL)</text>
          <g transform="translate(0, 18)">
            <!-- Toggle 1: NDA -->
            <rect x="0" y="0" width="170" height="34" rx="3" fill="#131c31" stroke="#334155"/>
            <rect x="10" y="10" width="14" height="14" rx="2" fill="#8b5cf6"/>
            <path d="M 13 17 L 16 20 L 21 14" stroke="#ffffff" stroke-width="1.5" fill="none"/>
            <text x="32" y="21" class="font-sans" font-size="10px" font-weight="600" fill="#f1f5f9">Require Signed NDA</text>

            <!-- Toggle 2: Safety Rules -->
            <rect x="180" y="0" width="170" height="34" rx="3" fill="#131c31" stroke="#334155"/>
            <rect x="190" y="10" width="14" height="14" rx="2" fill="#8b5cf6"/>
            <path d="M 193 17 L 196 20 L 201 14" stroke="#ffffff" stroke-width="1.5" fill="none"/>
            <text x="212" y="21" class="font-sans" font-size="10px" font-weight="600" fill="#f1f5f9">Safety &amp; PPE Briefing</text>

            <!-- Toggle 3: Photo ID -->
            <rect x="360" y="0" width="182" height="34" rx="3" fill="#131c31" stroke="#334155"/>
            <rect x="370" y="10" width="14" height="14" rx="2" fill="#8b5cf6"/>
            <path d="M 373 17 L 376 20 L 381 14" stroke="#ffffff" stroke-width="1.5" fill="none"/>
            <text x="392" y="21" class="font-sans" font-size="10px" font-weight="600" fill="#f1f5f9">Govt Photo ID Upload</text>
          </g>
        </g>

        <!-- Submit Strip -->
        <g transform="translate(0, 192)">
          <rect x="382" y="0" width="160" height="34" rx="3" fill="#8b5cf6"/>
          <text x="462" y="21" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="600" fill="#ffffff">Create &amp; Dispatch Link →</text>
          <text x="0" y="21" class="font-sans" font-size="10px" fill="#94a3b8">Invited by: Sarah Lin (Lead Quality Engineer) · Ext #842</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT: VISITOR MOBILE WEB PRE-CHECK-IN - 480px Width           -->
  <!-- ============================================================== -->
  <g transform="translate(690, 90)">
    <rect width="470" height="430" class="card"/>

    <!-- Header -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="100" height="20" rx="3" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6"/>
      <text x="50" y="14" text-anchor="middle" class="font-sans section-label" fill="#60a5fa">ROLE 02 · VISITOR</text>
      <text x="0" y="46" class="title-text">Mobile Pre-Check-in Experience</text>
      <text x="0" y="64" class="body-text">Zero app download. Visitors confirm attendance, sign NDAs, and get gate QR codes.</text>
    </g>

    <!-- 2 Smartphone Screens Comparison -->
    <!-- Screen A: Step 1 (Sign NDA & Details) -->
    <g transform="translate(30, 96)">
      <rect width="195" height="308" class="phone-frame"/>
      <rect x="5" y="6" width="185" height="296" class="phone-screen"/>

      <!-- Speaker Notch -->
      <rect x="70" y="10" width="50" height="3" rx="1.5" fill="#334155"/>

      <!-- Screen Title -->
      <text x="14" y="32" class="font-sans" font-size="9px" font-weight="700" fill="#60a5fa">STEP 1 OF 2 · DETAILS &amp; NDA</text>
      <text x="14" y="46" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">Visit Confirmation</text>

      <!-- Input box -->
      <text x="14" y="68" class="font-sans" font-size="8px" fill="#64748b">VEHICLE PLATE (OPTIONAL)</text>
      <rect x="14" y="74" width="157" height="20" rx="2" fill="#131c31" stroke="#334155"/>
      <text x="20" y="87" class="font-sans" font-size="8.5px" fill="#f8fafc">HH-TX 489</text>

      <!-- NDA agreement box -->
      <text x="14" y="108" class="font-sans" font-size="8px" fill="#64748b">LEGAL CONFIDENTIALITY (NDA)</text>
      <rect x="14" y="114" width="157" height="65" rx="2" fill="#090e1a" stroke="#334155"/>
      <text x="20" y="128" class="font-sans" font-size="7px" fill="#94a3b8">"Visitor agrees not to photograph</text>
      <text x="20" y="138" class="font-sans" font-size="7px" fill="#94a3b8">or disclose proprietary fixtures</text>
      <text x="20" y="148" class="font-sans" font-size="7px" fill="#94a3b8">inside Nordic Machining Lines."</text>
      <!-- Signature line -->
      <line x1="20" y1="168" x2="160" y2="168" stroke="#334155" stroke-width="0.8"/>
      <path d="M 24 165 Q 40 152 50 162 T 80 158 T 110 164" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="115" y="166" class="font-sans" font-size="6px" fill="#3b82f6">Marcus Vance</text>

      <!-- Continue button -->
      <rect x="14" y="190" width="157" height="24" rx="2" fill="#2563eb"/>
      <text x="92" y="205" text-anchor="middle" class="font-sans" font-size="8.5px" font-weight="600" fill="#ffffff">Confirm &amp; Generate Pass →</text>
    </g>

    <!-- Screen B: Step 2 (Issued QR Pass) -->
    <g transform="translate(245, 96)">
      <rect width="195" height="308" class="phone-frame"/>
      <rect x="5" y="6" width="185" height="296" class="phone-screen"/>

      <!-- Speaker Notch -->
      <rect x="70" y="10" width="50" height="3" rx="1.5" fill="#334155"/>

      <!-- Screen Title -->
      <text x="14" y="32" class="font-sans" font-size="9px" font-weight="700" fill="#34d399">STEP 2 OF 2 · READY</text>
      <text x="14" y="46" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">Digital Access Pass</text>

      <!-- White Pass Card -->
      <g transform="translate(14, 58)">
        <rect width="157" height="185" rx="4" fill="#ffffff"/>

        <text x="78" y="18" text-anchor="middle" class="font-sans" font-size="9px" font-weight="800" fill="#0a0a0a">NORDIC PLANT GATE 01</text>
        <text x="78" y="30" text-anchor="middle" class="font-sans" font-size="7.5px" fill="#64748b">Marcus Vance · Apex Tooling</text>

        <!-- QR box -->
        <g transform="translate(36, 40)">
          <rect width="85" height="85" fill="#f8fafc" stroke="#e2e8f0"/>
          <rect x="6" y="6" width="22" height="22" fill="#0a0a0a"/>
          <rect x="10" y="10" width="14" height="14" fill="#ffffff"/>
          <rect x="12" y="12" width="10" height="10" fill="#0a0a0a"/>

          <rect x="57" y="6" width="22" height="22" fill="#0a0a0a"/>
          <rect x="61" y="10" width="14" height="14" fill="#ffffff"/>
          <rect x="63" y="12" width="10" height="10" fill="#0a0a0a"/>

          <rect x="6" y="57" width="22" height="22" fill="#0a0a0a"/>
          <rect x="10" y="61" width="14" height="14" fill="#ffffff"/>
          <rect x="12" y="63" width="10" height="10" fill="#0a0a0a"/>

          <!-- Random pixels -->
          <rect x="36" y="20" width="8" height="8" fill="#0a0a0a"/>
          <rect x="42" y="40" width="12" height="12" fill="#0a0a0a"/>
          <rect x="60" y="45" width="8" height="8" fill="#0a0a0a"/>
        </g>

        <text x="78" y="142" text-anchor="middle" class="font-sans" font-size="7.5px" font-weight="700" fill="#059669">✓ PRE-CLEARANCE VERIFIED</text>
        <text x="78" y="154" text-anchor="middle" class="font-sans" font-size="7px" fill="#64748b">Present to Security Guard</text>

        <rect x="10" y="162" width="137" height="16" rx="2" fill="#f1f5f9"/>
        <text x="78" y="173" text-anchor="middle" class="font-sans" font-size="7px" font-weight="600" fill="#0a0a0a">Add to Apple Wallet / Google Pay</text>
      </g>

      <text x="97" y="260" text-anchor="middle" class="font-sans" font-size="8px" fill="#94a3b8">Directions: North Perimeter Gate</text>
    </g>
  </g>

</svg>

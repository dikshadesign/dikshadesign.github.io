<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f3f4f6; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .font-mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
      .card-white { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; rx: 8; }
      .card-inner { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; rx: 6; }
      .pill-active { fill: #111827; rx: 14; }
      .pill-inactive { fill: transparent; stroke: #e5e7eb; stroke-width: 1; rx: 14; }
      .btn-dark { fill: #111827; rx: 6; }
      .btn-outline { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <!-- Browser Frame Background -->
  <rect width="1200" height="720" class="bg"/>

  <!-- Top App Navigation Bar -->
  <rect width="1200" height="52" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Nordic Red N Logo -->
  <g transform="translate(18, 14)">
    <rect width="24" height="24" rx="5" fill="#ef4444"/>
    <path d="M 6 18 L 6 6 L 10 6 L 14 14 L 14 6 L 18 6 L 18 18 L 14 18 L 10 10 L 10 18 Z" fill="#ffffff"/>
  </g>

  <!-- Top Nav Pills -->
  <g transform="translate(60, 12)">
    <!-- Overview -->
    <rect x="0" y="0" width="75" height="28" rx="14" fill="#f3f4f6"/>
    <text x="37" y="18" class="font-sans" font-size="11px" font-weight="500" fill="#4b5563" text-anchor="middle">Overview</text>

    <!-- Sales & BD -->
    <rect x="82" y="0" width="85" height="28" rx="14" fill="#f3f4f6"/>
    <text x="124" y="18" class="font-sans" font-size="11px" font-weight="500" fill="#4b5563" text-anchor="middle">Sales &amp; BD</text>

    <!-- Projects -->
    <rect x="174" y="0" width="70" height="28" rx="14" fill="#f3f4f6"/>
    <text x="209" y="18" class="font-sans" font-size="11px" font-weight="500" fill="#4b5563" text-anchor="middle">Projects</text>

    <!-- Engineering (Active Pill) -->
    <rect x="250" y="0" width="95" height="28" rx="14" fill="#111827"/>
    <circle cx="264" cy="14" r="3" fill="#60a5fa"/>
    <text x="296" y="18" class="font-sans" font-size="11px" font-weight="600" fill="#ffffff" text-anchor="middle">Engineering</text>

    <!-- Finance & Investor -->
    <rect x="352" y="0" width="115" height="28" rx="14" fill="#f3f4f6"/>
    <text x="409" y="18" class="font-sans" font-size="11px" font-weight="500" fill="#4b5563" text-anchor="middle">Finance &amp; Investor</text>

    <!-- Operations & Supply -->
    <rect x="474" y="0" width="125" height="28" rx="14" fill="#f3f4f6"/>
    <text x="536" y="18" class="font-sans" font-size="11px" font-weight="500" fill="#4b5563" text-anchor="middle">Operations &amp; Supply</text>

    <!-- People & HR -->
    <rect x="606" y="0" width="85" height="28" rx="14" fill="#f3f4f6"/>
    <text x="648" y="18" class="font-sans" font-size="11px" font-weight="500" fill="#4b5563" text-anchor="middle">People &amp; HR</text>

    <!-- Admin & Setup -->
    <rect x="698" y="0" width="95" height="28" rx="14" fill="#f3f4f6"/>
    <text x="745" y="18" class="font-sans" font-size="11px" font-weight="500" fill="#4b5563" text-anchor="middle">Admin &amp; Setup</text>
  </g>

  <!-- Right Header Icons -->
  <g transform="translate(1040, 14)">
    <text x="0" y="17" class="font-sans" font-size="11px" fill="#4b5563">Requests</text>
    <circle cx="75" cy="12" r="12" fill="#111827"/>
    <text x="75" y="16" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="100" y="17" class="font-sans" font-size="10px" fill="#6b7280">All Bookmarks</text>
  </g>

  <!-- Left Sidebar Icons Strip -->
  <g transform="translate(0, 52)">
    <rect width="48" height="668" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Icons placeholder vertical stack -->
    <circle cx="24" cy="25" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="60" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="95" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="130" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="165" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="200" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="235" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="270" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="305" r="7" fill="#e5e7eb"/>
    <circle cx="24" cy="620" r="7" fill="#e5e7eb"/>
  </g>

  <!-- MAIN WORKSPACE CONTENT -->
  <g transform="translate(70, 72)">
    
    <!-- Workspace Title Row -->
    <text x="0" y="24" class="font-sans" font-size="22px" font-weight="800" fill="#111827">Projects Workspace</text>
    <text x="0" y="44" class="font-sans" font-size="12px" fill="#6b7280">Central operational hub • 3 active projects in flight across organization</text>

    <!-- Right Live Project Badge -->
    <g transform="translate(940, 10)">
      <circle cx="0" cy="10" r="3.5" fill="#ef4444"/>
      <text x="10" y="14" class="font-sans" font-size="11px" font-weight="700" fill="#111827">PROJECT: tt</text>
      <rect x="85" y="0" width="18" height="18" rx="9" fill="#f3f4f6"/>
      <text x="94" y="13" class="font-sans" font-size="10px" font-weight="600" fill="#4b5563" text-anchor="middle">3</text>
    </g>

    <!-- Sub-Filter Bar Row -->
    <g transform="translate(0, 68)">
      <text x="0" y="18" class="font-sans" font-size="12px" font-weight="600" fill="#374151">tt • Proof of Concept</text>

      <!-- Pipeline Sub-Tabs on Right -->
      <g transform="translate(560, 0)">
        <rect x="0" y="0" width="145" height="26" class="pill-inactive"/>
        <text x="72" y="17" class="font-sans" font-size="10px" fill="#6b7280" text-anchor="middle">Technical Pipeline · 2 Steps</text>

        <rect x="155" y="0" width="145" height="26" class="pill-active"/>
        <text x="227" y="17" class="font-sans" font-size="10px" font-weight="600" fill="#ffffff" text-anchor="middle">Project Pipeline · Execution</text>

        <rect x="310" y="0" width="125" height="26" class="pill-inactive"/>
        <text x="372" y="17" class="font-sans" font-size="10px" fill="#6b7280" text-anchor="middle">Procurement &amp; BOM</text>

        <rect x="445" y="0" width="85" height="26" class="pill-inactive"/>
        <text x="487" y="17" class="font-sans" font-size="10px" fill="#6b7280" text-anchor="middle">Sales Pipeline</text>
      </g>
    </g>

    <!-- MAIN ACTIVE PROJECT CARD CONTAINER -->
    <g transform="translate(0, 110)">
      <rect width="1090" height="460" class="card-white"/>

      <!-- Card Top Info Header -->
      <g transform="translate(24, 22)">
        <rect x="0" y="0" width="75" height="20" rx="4" fill="#f3f4f6"/>
        <text x="37" y="14" class="font-mono" font-size="9.5px" font-weight="700" fill="#374151" text-anchor="middle">BD 28 0004</text>

        <rect x="85" y="0" width="55" height="20" rx="10" fill="#f3f4f6"/>
        <text x="112" y="14" class="font-sans" font-size="9.5px" font-weight="600" fill="#4b5563" text-anchor="middle">Rung 2</text>

        <text x="0" y="44" class="font-sans" font-size="20px" font-weight="800" fill="#111827">tt</text>
        <text x="0" y="62" class="font-sans" font-size="11.5px" fill="#6b7280">ysr • Owner: <tspan font-weight="600" fill="#111827">Ayush</tspan></text>

        <!-- Right Side: Costing & Formal Handover Button -->
        <g transform="translate(850, 6)">
          <text x="50" y="24" class="font-sans" font-size="20px" font-weight="800" fill="#111827">₹77.0 L</text>
          
          <rect x="135" y="4" width="115" height="28" rx="14" class="btn-outline"/>
          <text x="192" y="22" class="font-sans" font-size="10.5px" font-weight="600" fill="#111827" text-anchor="middle">Formal Handover</text>

          <circle cx="265" cy="18" r="10" fill="#f3f4f6"/>
          <path d="M 261 20 L 265 16 L 269 20" stroke="#4b5563" stroke-width="1.5" fill="none"/>
        </g>
      </g>

      <!-- Stage 2 of 9 Indicator Strip -->
      <g transform="translate(24, 105)">
        <text x="0" y="12" class="font-sans" font-size="11.5px" font-weight="700" fill="#111827">POC (Client) · <tspan font-weight="500" fill="#6b7280">Stage 2 of 9</tspan></text>

        <!-- 9 Segment Progress Indicator -->
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="28" height="4" rx="2" fill="#111827"/>
          <rect x="34" y="0" width="28" height="4" rx="2" fill="#111827"/>
          <rect x="68" y="0" width="28" height="4" rx="2" fill="#e5e7eb"/>
          <rect x="102" y="0" width="28" height="4" rx="2" fill="#e5e7eb"/>
          <rect x="136" y="0" width="28" height="4" rx="2" fill="#e5e7eb"/>
          <rect x="170" y="0" width="28" height="4" rx="2" fill="#e5e7eb"/>
          <rect x="204" y="0" width="28" height="4" rx="2" fill="#e5e7eb"/>
          <rect x="238" y="0" width="28" height="4" rx="2" fill="#e5e7eb"/>
          <rect x="272" y="0" width="28" height="4" rx="2" fill="#e5e7eb"/>
        </g>

        <!-- Context Links on Right -->
        <g transform="translate(770, 10)">
          <text x="0" y="12" class="font-sans" font-size="11px" fill="#4b5563">Handover Details</text>
          <text x="120" y="12" class="font-sans" font-size="11px" fill="#4b5563">Stage Owners</text>
          <text x="210" y="12" class="font-sans" font-size="11px" font-weight="600" fill="#111827">Files &amp; Drawings <tspan fill="#6b7280">2</tspan></text>
        </g>
      </g>

      <!-- ACTIVE STEP DETAIL CARD (Step 5 · Feasibility Trial) -->
      <g transform="translate(24, 155)">
        <rect width="1042" height="270" class="card-inner"/>

        <!-- Top Step Header Banner -->
        <rect width="1042" height="42" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="6 6 0 0"/>
        
        <circle cx="25" cy="21" r="9" fill="#f3f4f6"/>
        <path d="M 22 21 L 28 21 M 25 18 L 25 24" stroke="#4b5563" stroke-width="1.5"/>

        <text x="44" y="25" class="font-sans" font-size="12.5px" font-weight="700" fill="#111827">Step 5 · Customer Feasibility Trial Report</text>
        <text x="320" y="25" class="font-sans" font-size="11px" fill="#6b7280">Awaiting Engineering POC captures</text>

        <rect x="880" y="11" width="145" height="22" rx="4" fill="#f3f4f6"/>
        <text x="952" y="25" class="font-sans" font-size="10px" font-weight="600" fill="#374151" text-anchor="middle">Action With: <tspan fill="#0284c7">Engineering</tspan></text>

        <!-- Card Body Area -->
        <g transform="translate(24, 65)">
          <text x="0" y="20" class="font-sans" font-size="15px" font-weight="700" fill="#111827">Engineering POC in Progress</text>
          <text x="0" y="38" class="font-sans" font-size="12px" fill="#6b7280">Physical sample testing and optics validation in progress.</text>

          <!-- Action Buttons on Right -->
          <g transform="translate(620, 8)">
            <rect x="0" y="0" width="150" height="34" rx="6" class="btn-outline"/>
            <text x="75" y="21" class="font-sans" font-size="11px" font-weight="600" fill="#374151" text-anchor="middle">Nudge Engineering Lead</text>

            <rect x="165" y="0" width="195" height="34" rx="6" class="btn-dark"/>
            <text x="262" y="21" class="font-sans" font-size="11px" font-weight="600" fill="#ffffff" text-anchor="middle">Prepare Drawing &amp; Specs Early →</text>
          </g>

          <!-- Field Metadata Details Row -->
          <g transform="translate(0, 85)">
            <rect width="994" height="65" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="4"/>

            <!-- Meta Col 1: Technical Stage -->
            <g transform="translate(18, 18)">
              <text x="0" y="10" class="font-sans" font-size="9px" font-weight="700" fill="#6b7280" letter-spacing="0.05em">TECHNICAL STAGE</text>
              <text x="0" y="28" class="font-sans" font-size="11.5px" font-weight="600" fill="#111827">Proof of Concept (POC)</text>
            </g>

            <!-- Meta Col 2: Physical Samples -->
            <g transform="translate(320, 18)">
              <text x="0" y="10" class="font-sans" font-size="9px" font-weight="700" fill="#6b7280" letter-spacing="0.05em">PHYSICAL SAMPLES</text>
              <text x="0" y="28" class="font-sans" font-size="11.5px" font-weight="600" fill="#111827">Awaiting Client Samples</text>
            </g>

            <!-- Meta Col 3: Customer Account -->
            <g transform="translate(620, 18)">
              <text x="0" y="10" class="font-sans" font-size="9px" font-weight="700" fill="#6b7280" letter-spacing="0.05em">CUSTOMER ACCOUNT</text>
              <text x="0" y="28" class="font-sans" font-size="11.5px" font-weight="600" fill="#111827">ysr</text>
            </g>
          </g>
        </g>
      </g>
    </g>

  </g>

  <!-- Bottom Dev Port Indicator -->
  <rect x="0" y="700" width="1200" height="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="14" y="714" class="font-mono" font-size="10px" fill="#6b7280">localhost:3002/daily-activity</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; }
      .col-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .phase-num { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; fill: #5269b5; letter-spacing: 0.1em; text-transform: uppercase; }
      .phase-title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; margin-top: 4px; }
      .lane-label { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9.5px; font-weight: 700; fill: #64748b; text-transform: uppercase; letter-spacing: 0.08em; }
      .lane-text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11px; line-height: 1.5; fill: #334155; }
      .lane-bg { fill: #f1f5f9; rx: 2; }
      .curve-line { stroke: #5269b5; stroke-width: 3; fill: none; }
      .node { fill: #ffffff; stroke: #5269b5; stroke-width: 2.5; }
      .metric-tag { fill: rgba(82, 105, 181, 0.1); stroke: rgba(82, 105, 181, 0.3); rx: 10; }
      .metric-tag-text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9px; font-weight: 700; fill: #5269b5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" class="bg"/>

  <!-- Top Title Banner -->
  <rect x="40" y="25" width="1120" height="48" class="col-card"/>
  <text x="64" y="54" class="header-title">AERA · Spatial System Journey &amp; Operational Blueprint</text>
  <text x="700" y="54" class="header-sub">Continuous environmental balancing across an 8-hour commercial business day</text>

  <!-- 5 Columns for Journey Phases -->
  <!-- Phase 1: 08:00 Initial Baseline -->
  <g transform="translate(40, 90)">
    <rect width="212" height="370" class="col-card"/>
    <text x="16" y="24" class="phase-num">01 / 08:00</text>
    <text x="16" y="44" class="phase-title">Morning Baseline</text>
    <rect x="16" y="54" width="70" height="18" class="metric-tag"/>
    <text x="51" y="66" text-anchor="middle" class="metric-tag-text">AQI: 98 (OPTIMAL)</text>

    <!-- Swimlanes -->
    <rect x="14" y="85" width="184" height="65" class="lane-bg"/>
    <text x="22" y="102" class="lane-label">Occupant State</text>
    <text x="22" y="122" class="lane-text">Building opens; empty workspaces and low particulate load.</text>

    <rect x="14" y="160" width="184" height="75" class="lane-bg"/>
    <text x="22" y="177" class="lane-label">AERA Hardware Action</text>
    <text x="22" y="197" class="lane-text">Units run on Eco Low (24 dBA); baseline laser sensors calibrate ambient levels.</text>

    <rect x="14" y="245" width="184" height="75" class="lane-bg"/>
    <text x="22" y="262" class="lane-label">Digital Dashboard State</text>
    <text x="22" y="282" class="lane-text">Facility manager overview confirms all 12 zones are green &amp; online.</text>

    <rect x="14" y="330" width="184" height="25" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
    <text x="106" y="346" text-anchor="middle" font-size="9px" font-weight="600" fill="#64748b">Sensor State: Calibrating</text>
  </g>

  <!-- Phase 2: 10:00 Occupancy Influx -->
  <g transform="translate(267, 90)">
    <rect width="212" height="370" class="col-card"/>
    <text x="16" y="24" class="phase-num">02 / 10:00</text>
    <text x="16" y="44" class="phase-title">Occupancy Influx</text>
    <rect x="16" y="54" width="76" height="18" class="metric-tag"/>
    <text x="54" y="66" text-anchor="middle" class="metric-tag-text">AQI: 72 (MODERATE)</text>

    <rect x="14" y="85" width="184" height="65" class="lane-bg"/>
    <text x="22" y="102" class="lane-label">Occupant State</text>
    <text x="22" y="122" class="lane-text">High footfall in reception; external dust and PM ingress from elevators.</text>

    <rect x="14" y="160" width="184" height="75" class="lane-bg"/>
    <text x="22" y="177" class="lane-label">AERA Hardware Action</text>
    <text x="22" y="197" class="lane-text">Zone 01 units automatically ramp up intake velocity; localized purification curtain active.</text>

    <rect x="14" y="245" width="184" height="75" class="lane-bg"/>
    <text x="22" y="262" class="lane-label">Digital Dashboard State</text>
    <text x="22" y="282" class="lane-text">Reception zone flags amber surge; app displays automated airflow diversion.</text>

    <rect x="14" y="330" width="184" height="25" fill="#fef3c7" stroke="#fcd34d" rx="3"/>
    <text x="106" y="346" text-anchor="middle" font-size="9px" font-weight="700" fill="#d97706">Dynamic Ramp: 65% RPM</text>
  </g>

  <!-- Phase 3: 14:00 Meeting Room Peak -->
  <g transform="translate(494, 90)">
    <rect width="212" height="370" class="col-card"/>
    <text x="16" y="24" class="phase-num">03 / 14:00</text>
    <text x="16" y="44" class="phase-title">Conference Surge</text>
    <rect x="16" y="54" width="76" height="18" class="metric-tag" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="54" y="66" text-anchor="middle" class="metric-tag-text" fill="#ef4444">CO2: 1350 PPM</text>

    <rect x="14" y="85" width="184" height="65" class="lane-bg"/>
    <text x="22" y="102" class="lane-label">Occupant State</text>
    <text x="22" y="122" class="lane-text">14 occupants in closed 25 m² room; air feels stuffy, focus declining.</text>

    <rect x="14" y="160" width="184" height="75" class="lane-bg"/>
    <text x="22" y="177" class="lane-label">AERA Hardware Action</text>
    <text x="22" y="197" class="lane-text">Ceiling unit triggers cross-ventilation exhaust mode, dissipating CO2 into circulation plenum.</text>

    <rect x="14" y="245" width="184" height="75" class="lane-bg"/>
    <text x="22" y="262" class="lane-label">Digital Dashboard State</text>
    <text x="22" y="282" class="lane-text">Air dashboard reports rapid CO2 recovery curve within 8 minutes.</text>

    <rect x="14" y="330" width="184" height="25" fill="#fee2e2" stroke="#f87171" rx="3"/>
    <text x="106" y="346" text-anchor="middle" font-size="9px" font-weight="700" fill="#dc2626">Cross-Flow Flush Active</text>
  </g>

  <!-- Phase 4: 16:30 Steady State Work -->
  <g transform="translate(721, 90)">
    <rect width="212" height="370" class="col-card"/>
    <text x="16" y="24" class="phase-num">04 / 16:30</text>
    <text x="16" y="44" class="phase-title">Steady State Dwell</text>
    <rect x="16" y="54" width="70" height="18" class="metric-tag"/>
    <text x="51" y="66" text-anchor="middle" class="metric-tag-text">AQI: 95 (OPTIMAL)</text>

    <rect x="14" y="85" width="184" height="65" class="lane-bg"/>
    <text x="22" y="102" class="lane-label">Occupant State</text>
    <text x="22" y="122" class="lane-text">Sustained deep work in open desk rows; zero draft or audible distraction.</text>

    <rect x="14" y="160" width="184" height="75" class="lane-bg"/>
    <text x="22" y="177" class="lane-label">AERA Hardware Action</text>
    <text x="22" y="197" class="lane-text">Whisper-quiet radial diffusion maintains clean air envelope without noticeable breeze.</text>

    <rect x="14" y="245" width="184" height="75" class="lane-bg"/>
    <text x="22" y="262" class="lane-label">Digital Dashboard State</text>
    <text x="22" y="282" class="lane-text">Zone energy efficiency optimization: total floor consumption at 180W.</text>

    <rect x="14" y="330" width="184" height="25" fill="#f0fdf4" stroke="#86efac" rx="3"/>
    <text x="106" y="346" text-anchor="middle" font-size="9px" font-weight="700" fill="#16a34a">31 dBA Background Sound</text>
  </g>

  <!-- Phase 5: 18:30 Filter & Upkeep Alert -->
  <g transform="translate(948, 90)">
    <rect width="212" height="370" class="col-card"/>
    <text x="16" y="24" class="phase-num">05 / 18:30</text>
    <text x="16" y="44" class="phase-title">Service Maintenance</text>
    <rect x="16" y="54" width="80" height="18" class="metric-tag" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="56" y="66" text-anchor="middle" class="metric-tag-text" fill="#2563eb">UPKEEP DUE: 14D</text>

    <rect x="14" y="85" width="184" height="65" class="lane-bg"/>
    <text x="22" y="102" class="lane-label">Occupant State</text>
    <text x="22" y="122" class="lane-text">Staff departs for the day; space transitions into nighttime facility cleaning.</text>

    <rect x="14" y="160" width="184" height="75" class="lane-bg"/>
    <text x="22" y="177" class="lane-label">AERA Hardware Action</text>
    <text x="22" y="197" class="lane-text">Unit 03 LED ring glows soft amber; filter pressure differential prompts replacement warning.</text>

    <rect x="14" y="245" width="184" height="75" class="lane-bg"/>
    <text x="22" y="262" class="lane-label">Digital Dashboard State</text>
    <text x="22" y="282" class="lane-text">Technician receives automatic task ticket with exact unit location and filter part number.</text>

    <rect x="14" y="330" width="184" height="25" fill="#eff6ff" stroke="#93c5fd" rx="3"/>
    <text x="106" y="346" text-anchor="middle" font-size="9px" font-weight="700" fill="#2563eb">Auto-Ticket Dispatched</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070c18; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .glow-layer { filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6)); }
      .app-tab { rx: 4; stroke-width: 1.2; }
      .connector { stroke: #38bdf8; stroke-width: 1.8; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="640" class="bg"/>

  <!-- Ambient background glow elements -->
  <circle cx="200" cy="180" r="180" fill="#0284c7" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="460" r="220" fill="#4f46e5" opacity="0.08" filter="blur(80px)"/>

  <!-- Top Title Banner -->
  <rect x="40" y="24" width="1120" height="42" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="4"/>
  <text x="60" y="50" class="font-sans" font-size="14px" font-weight="700" fill="#f8fafc">Nordic ONE · The Unified Industrial Software Ecosystem</text>
  <text x="740" y="50" class="font-sans" font-size="11px" fill="#94a3b8">One coherent platform experience connecting five specialised operational domains</text>

  <!-- LAYERED ECOSYSTEM COMPOSITION -->
  
  <!-- Central Hero Platform Shell Window (Main Backdrop) -->
  <g transform="translate(60, 90)" class="glow-layer">
    <!-- Window Outer -->
    <rect width="1080" height="490" fill="#0b1120" stroke="#334155" stroke-width="1.5" rx="6"/>
    
    <!-- Shell Header -->
    <rect width="1080" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="6 6 0 0"/>
    <g transform="translate(20, 15)">
      <rect width="22" height="22" rx="3" fill="#38bdf8"/>
      <polygon points="11,5 16,17 6,17" fill="#0f172a"/>
      <text x="32" y="16" class="font-sans" font-size="13px" font-weight="800" fill="#f8fafc">NORDIC <tspan fill="#38bdf8">ONE</tspan></text>
      <text x="145" y="16" class="font-sans" font-size="11px" fill="#64748b">| Connected Industrial Operations Platform v3.4</text>
    </g>

    <g transform="translate(720, 15)">
      <rect width="160" height="24" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#10b981"/>
      <text x="24" y="15" class="font-sans" font-size="10px" font-weight="600" fill="#cbd5e1">5 Micro-Apps Synced</text>

      <rect x="175" width="160" height="24" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="185" y="15" class="font-sans" font-size="10px" fill="#94a3b8">Tenant: Global Mfg Corp</text>
    </g>

    <!-- 5 OVERLAPPING PRODUCT WORKSPACES IN PERSPECTIVE -->

    <!-- Card 1: Nordic Vision -->
    <g transform="translate(30, 75)" class="glow-layer">
      <rect width="320" height="185" fill="#090d16" stroke="#0284c7" stroke-width="1.5" rx="4"/>
      <rect width="320" height="30" fill="#0284c7" rx="4 4 0 0"/>
      <text x="12" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">01 · Nordic Vision (Optical AI)</text>
      <text x="240" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#e0f2fe">● 60 FPS FEED</text>

      <!-- Mini UI -->
      <rect x="12" y="42" width="180" height="120" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2"/>
      <line x1="102" y1="42" x2="102" y2="162" stroke="#334155" stroke-dasharray="2 2"/>
      <line x1="12" y1="102" x2="192" y2="102" stroke="#334155" stroke-dasharray="2 2"/>
      <rect x="75" y="75" width="50" height="35" fill="rgba(244,63,94,0.25)" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="78" y="70" class="font-sans" font-size="8px" font-weight="700" fill="#f43f5e">DEFECT 98.4%</text>

      <g transform="translate(202, 42)">
        <text x="0" y="14" class="font-sans" font-size="9.5px" font-weight="700" fill="#f8fafc">Station 04 Camera</text>
        <text x="0" y="28" class="font-sans" font-size="8.5px" fill="#94a3b8">Batch: Lot B-881</text>
        <text x="0" y="42" class="font-sans" font-size="8.5px" fill="#94a3b8">Part: Turbine Blade</text>
        
        <rect y="54" width="105" height="18" rx="2" fill="#e11d48"/>
        <text x="52" y="66" text-anchor="middle" class="font-sans" font-size="8px" font-weight="700" fill="#fff">AUTO-HOLD SENT</text>

        <text x="0" y="90" class="font-sans" font-size="8px" fill="#64748b">Latency: 14ms</text>
        <text x="0" y="102" class="font-sans" font-size="8px" fill="#64748b">ISO Compliance: Level A</text>
      </g>
    </g>

    <!-- Card 2: Nordic MES (Center-Left) -->
    <g transform="translate(380, 75)" class="glow-layer">
      <rect width="320" height="185" fill="#0f172a" stroke="#059669" stroke-width="1.5" rx="4"/>
      <rect width="320" height="30" fill="#059669" rx="4 4 0 0"/>
      <text x="12" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">02 · Nordic MES (Shop Floor)</text>
      <text x="240" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#d1fae5">OEE: 91.8%</text>

      <!-- Mini UI -->
      <g transform="translate(14, 42)">
        <rect width="292" height="42" rx="2" fill="#fff1f2" stroke="#f43f5e" stroke-width="1"/>
        <text x="10" y="16" class="font-sans" font-size="8.5px" font-weight="700" fill="#9f1239">WORK ORDER WO-8912 PAUSED</text>
        <text x="10" y="32" class="font-sans" font-size="8px" fill="#be123c">Interlock received from Station 04 Vision</text>

        <!-- CNC Telemetry -->
        <g transform="translate(0, 52)">
          <rect width="140" height="65" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2"/>
          <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">Line 03 Spindle</text>
          <text x="10" y="36" class="font-sans" font-size="13px" font-weight="800" fill="#f8fafc">12,450 <tspan font-size="8px">RPM</tspan></text>
          <text x="10" y="52" class="font-sans" font-size="7.5px" fill="#10b981">● RUNNING STABLE</text>

          <rect x="152" width="140" height="65" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2"/>
          <text x="10" y="18" class="font-sans" font-size="8.5px" fill="#94a3b8">Shift Progress</text>
          <text x="10" y="36" class="font-sans" font-size="13px" font-weight="800" fill="#f8fafc">412 / 500</text>
          <text x="10" y="52" class="font-sans" font-size="7.5px" fill="#38bdf8">Batch B-881 Part 402</text>
        </g>
      </g>
    </g>

    <!-- Card 3: Nordic ERP (Right) -->
    <g transform="translate(730, 75)" class="glow-layer">
      <rect width="320" height="185" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5" rx="4"/>
      <rect width="320" height="30" fill="#4f46e5" rx="4 4 0 0"/>
      <text x="12" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">03 · Nordic ERP (Supply Chain)</text>
      <text x="240" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#e0e7ff">DISPATCH LEDGER</text>

      <!-- Mini UI -->
      <g transform="translate(14, 42)">
        <rect width="292" height="118" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2"/>
        <rect width="292" height="24" fill="#312e81"/>
        <text x="12" y="16" class="font-sans" font-size="8px" font-weight="700" fill="#c7d2fe">LOT ID</text>
        <text x="100" y="16" class="font-sans" font-size="8px" font-weight="700" fill="#c7d2fe">MATERIAL</text>
        <text x="200" y="16" class="font-sans" font-size="8px" font-weight="700" fill="#c7d2fe">ALLOCATION</text>

        <text x="12" y="44" class="font-sans" font-size="8px" fill="#f8fafc">Lot B-881</text>
        <text x="100" y="44" class="font-sans" font-size="8px" fill="#cbd5e1">Ti-6Al-4V</text>
        <rect x="200" y="34" width="75" height="14" rx="2" fill="#ef4444"/>
        <text x="237" y="44" text-anchor="middle" class="font-sans" font-size="7.5px" font-weight="700" fill="#fff">QUARANTINED</text>

        <text x="12" y="68" class="font-sans" font-size="8px" fill="#f8fafc">Lot B-882</text>
        <text x="100" y="68" class="font-sans" font-size="8px" fill="#cbd5e1">Inconel 718</text>
        <rect x="200" y="58" width="75" height="14" rx="2" fill="#10b981"/>
        <text x="237" y="68" text-anchor="middle" class="font-sans" font-size="7.5px" font-weight="700" fill="#fff">READY SHIP</text>

        <text x="12" y="92" class="font-sans" font-size="8px" fill="#f8fafc">Lot B-883</text>
        <text x="100" y="92" class="font-sans" font-size="8px" fill="#cbd5e1">Al-7075-T6</text>
        <rect x="200" y="82" width="75" height="14" rx="2" fill="#0284c7"/>
        <text x="237" y="92" text-anchor="middle" class="font-sans" font-size="7.5px" font-weight="700" fill="#fff">PROCESSING</text>
      </g>
    </g>

    <!-- Card 4: Nordic EQMS (Bottom Left) -->
    <g transform="translate(140, 280)" class="glow-layer">
      <rect width="380" height="180" fill="#0f172a" stroke="#d97706" stroke-width="1.5" rx="4"/>
      <rect width="380" height="30" fill="#d97706" rx="4 4 0 0"/>
      <text x="12" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">04 · Nordic EQMS (Quality Management &amp; Audit)</text>
      <text x="290" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#fef3c7">ISO-9001 / AS9100</text>

      <g transform="translate(14, 42)">
        <rect width="352" height="118" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2"/>
        <text x="12" y="20" class="font-sans" font-size="9.5px" font-weight="700" fill="#fbbf24">NON-CONFORMANCE REPORT: #NC-4402</text>
        <text x="12" y="38" class="font-sans" font-size="8.5px" fill="#cbd5e1">Auto-generated via Nordic Vision defect classification hook.</text>
        
        <rect x="12" y="50" width="160" height="48" fill="#111827" stroke="#334155" stroke-width="1" rx="2"/>
        <text x="20" y="66" class="font-sans" font-size="8px" fill="#94a3b8">Auditor Assigned</text>
        <text x="20" y="82" class="font-sans" font-size="10px" font-weight="700" fill="#f8fafc">Dr. Karin Lind</text>

        <rect x="180" y="50" width="160" height="48" fill="#111827" stroke="#334155" stroke-width="1" rx="2"/>
        <text x="188" y="66" class="font-sans" font-size="8px" fill="#94a3b8">CAPA Root Cause Status</text>
        <text x="188" y="82" class="font-sans" font-size="10px" font-weight="700" fill="#f59e0b">Investigation Active</text>

        <text x="12" y="110" class="font-sans" font-size="8px" fill="#64748b">Digital Signature verified by Nordic ONE Security Certificate #SH-9014</text>
      </g>
    </g>

    <!-- Card 5: Nordic Visitor Management (Bottom Right) -->
    <g transform="translate(560, 280)" class="glow-layer">
      <rect width="380" height="180" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
      <rect width="380" height="30" fill="#7c3aed" rx="4 4 0 0"/>
      <text x="12" y="20" class="font-sans" font-size="11px" font-weight="700" fill="#ffffff">05 · Nordic Visitor Management (Access &amp; Security)</text>
      <text x="310" y="20" class="font-sans" font-size="9px" font-weight="600" fill="#ede9fe">GATE 01 KIOSK</text>

      <g transform="translate(14, 42)">
        <rect width="352" height="118" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2"/>
        
        <!-- Badge preview -->
        <rect x="12" y="14" width="70" height="90" fill="#0b1120" stroke="#7c3aed" stroke-width="1" rx="2"/>
        <rect x="16" y="20" width="62" height="40" fill="#1e293b" rx="2"/>
        <circle cx="47" cy="38" r="12" fill="#c084fc"/>
        <text x="47" y="74" text-anchor="middle" class="font-sans" font-size="7.5px" font-weight="700" fill="#fff">AUDITOR</text>
        <rect x="22" y="82" width="50" height="12" rx="2" fill="#7c3aed"/>
        <text x="47" y="91" text-anchor="middle" class="font-sans" font-size="6.5px" font-weight="700" fill="#fff">PASS #091</text>

        <g transform="translate(94, 18)">
          <text x="0" y="12" class="font-sans" font-size="10px" font-weight="700" fill="#f8fafc">External ISO Auditor Check-in</text>
          <text x="0" y="28" class="font-sans" font-size="8.5px" fill="#cbd5e1">Visitor: H. Larsson (Bureau Veritas)</text>
          <text x="0" y="44" class="font-sans" font-size="8.5px" fill="#cbd5e1">Host: Quality Operations (Line 03)</text>
          <text x="0" y="60" class="font-sans" font-size="8.5px" fill="#10b981">✓ Digital NDA Signed at Kiosk</text>
          <text x="0" y="74" class="font-sans" font-size="8.5px" fill="#10b981">✓ Cleanroom PPE Certification Active</text>
          <text x="0" y="88" class="font-sans" font-size="8px" fill="#94a3b8">Cleanroom Escort: Required (Zone 2 Restricted)</text>
        </g>
      </g>
    </g>

    <!-- Connective Event Bus Line between Cards -->
    <path d="M 350 160 L 380 160" class="connector"/>
    <path d="M 700 160 L 730 160" class="connector"/>
    <path d="M 330 260 L 330 280" class="connector"/>
    <path d="M 750 260 L 750 280" class="connector"/>
  </g>
</svg>

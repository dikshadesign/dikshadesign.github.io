<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#ffffff"/>
  <!-- Cross Matrix -->
  <line x1="50" y1="50" x2="450" y2="450" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="50" y1="450" x2="450" y2="50" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Outer Box -->
  <rect x="75" y="75" width="350" height="350" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="125" y="125" width="250" height="250" fill="none" stroke="#000000" stroke-width="1"/>
  
  <!-- Pillar Labels -->
  <rect x="95" y="100" width="140" height="24" fill="#000000"/>
  <text x="165" y="116" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="0.08em">3D CAD · SOLIDWORKS</text>
  
  <rect x="265" y="100" width="140" height="24" fill="#000000"/>
  <text x="335" y="116" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="0.08em">DFM · SHEET METAL</text>
  
  <rect x="95" y="376" width="140" height="24" fill="#000000"/>
  <text x="165" y="392" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="0.08em">FIGMA · TOKENS</text>
  
  <rect x="265" y="376" width="140" height="24" fill="#000000"/>
  <text x="335" y="392" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="0.08em">NODE · VIBE CODING</text>
  
  <!-- Center Core -->
  <circle cx="250" cy="250" r="45" fill="#000000"/>
  <text x="250" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.04em">NID MP</text>
  <text x="250" y="260" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#ffffff">STACK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .shell { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 8; }
      .top-nav { fill: #090d16; stroke-bottom: #1e293b; }
      .card { fill: #131c31; stroke: #1e293b; stroke-width: 1.2; rx: 6; }
      .card-active { fill: #16223d; stroke: #38bdf8; stroke-width: 1.5; rx: 6; }
      .app-icon { rx: 8; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.45; }
      .badge { fill: rgba(56, 189, 248, 0.12); stroke: rgba(56, 189, 248, 0.35); rx: 10; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.08em; text-transform: uppercase; }
      .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 19px; font-weight: 800; fill: #f8fafc; }
      .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9.5px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
    </style>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="650" class="bg"/>

  <!-- Desktop Operating Window Frame -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="610" class="shell"/>

    <!-- Global App Shell Header -->
    <path d="M 0 8 Q 0 0 8 0 L 1132 0 Q 1140 0 1140 8 L 1140 52 L 0 52 Z" fill="#090e1a"/>
    <line x1="0" y1="52" x2="1140" y2="52" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Window Controls -->
    <circle cx="25" cy="26" r="5" fill="#ef4444"/>
    <circle cx="42" cy="26" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="26" r="5" fill="#10b981"/>

    <!-- Nordic ONE Brand / Logo -->
    <g transform="translate(90, 16)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#38bdf8"/>
      <polygon points="11,4 17,17 5,17" fill="#090e1a"/>
      <text x="32" y="16" font-family="Inter, sans-serif" font-size="13px" font-weight="800" fill="#f8fafc" letter-spacing="0.06em">Nordic <tspan fill="#38bdf8">One</tspan></text>
      <text x="125" y="16" font-family="Inter, sans-serif" font-size="11px" font-weight="500" fill="#64748b">/ Enterprise Hub</text>
    </g>

    <!-- Global Search Bar (Universal Switcher) -->
    <g transform="translate(390, 12)">
      <rect width="360" height="28" rx="5" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" font-family="Inter, sans-serif" font-size="11px" fill="#64748b">Search operations, apps, work orders... (Ctrl + K)</text>
      <rect x="315" y="5" width="36" height="18" rx="3" fill="#1e293b"/>
      <text x="333" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="9px" font-weight="600" fill="#94a3b8">⌘K</text>
    </g>

    <!-- Right User & Tenant Status -->
    <g transform="translate(920, 14)">
      <rect x="0" y="2" width="120" height="22" rx="11" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="13" r="3.5" fill="#10b981"/>
      <text x="24" y="16" font-family="Inter, sans-serif" font-size="10px" font-weight="700" fill="#10b981">All Systems OK</text>
      <circle cx="145" cy="13" r="13" fill="#334155"/>
      <text x="145" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="10px" font-weight="700" fill="#f8fafc">Ds</text>
    </g>

    <!-- Sub-header Breadcrumb / Ecosystem Banner -->
    <g transform="translate(30, 75)">
      <text x="0" y="20" font-family="Inter, sans-serif" font-size="20px" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">Industrial Software Ecosystem</text>
      <text x="0" y="40" font-family="Inter, sans-serif" font-size="12px" fill="#94a3b8">Central operational suite connecting machine vision, manufacturing execution, enterprise planning, and quality compliance.</text>
      <rect x="940" y="8" width="140" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="1010" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5px" font-weight="600" fill="#38bdf8">Plant: Skövde Line 4 ▾</text>
    </g>

    <!-- 4 Core Application Launcher Cards (252px each, 24px gap, 1080px total) -->
    <g transform="translate(30, 145)">
      
      <!-- Card 1: Nordic Vision (Flagship) -->
      <g transform="translate(0, 0)">
        <rect width="252" height="425" class="card-active"/>
        <rect width="252" height="6" fill="#38bdf8" rx="2"/>
        <rect x="18" y="20" width="40" height="40" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
        <circle cx="38" cy="40" r="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="38" cy="40" r="4.5" fill="#38bdf8"/>
        
        <text x="18" y="80" class="text-title">Nordic Vision</text>
        <text x="18" y="98" class="text-desc">Machine Vision &amp; Optical Inspection</text>

        <!-- Mini Camera Preview -->
        <rect x="16" y="115" width="220" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <!-- Inspection Bounding Box -->
        <rect x="42" y="135" width="95" height="60" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
        <rect x="42" y="125" width="50" height="12" fill="#10b981" rx="2"/>
        <text x="47" y="134" font-family="monospace" font-size="8.5px" font-weight="700" fill="#090e1a">Pass 99.8%</text>
        <circle cx="185" cy="165" r="16" fill="rgba(56, 189, 248, 0.2)"/>

        <!-- Real-time Stats -->
        <g transform="translate(18, 245)">
          <text x="0" y="15" class="stat-lbl">Inspection Rate</text>
          <text x="0" y="36" class="stat-val">420 <tspan font-size="11.5px" font-weight="500" fill="#64748b">parts/min</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Defect Detection</text>
          <text x="0" y="86" class="stat-val" fill="#10b981">0.02% <tspan font-size="11.5px" font-weight="500" fill="#64748b">defect rate</tspan></text>
        </g>

        <!-- Launch Button -->
        <rect x="16" y="370" width="220" height="36" rx="4" fill="#38bdf8"/>
        <text x="126" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5px" font-weight="700" fill="#090e1a">Open Vision ↗</text>
      </g>

      <!-- Card 2: Nordic ERP -->
      <g transform="translate(276, 0)">
        <rect width="252" height="425" class="card"/>
        <rect width="252" height="6" fill="#818cf8" rx="2"/>
        <rect x="18" y="20" width="40" height="40" rx="6" fill="rgba(129, 140, 248, 0.15)"/>
        <!-- Ledger icon -->
        <rect x="28" y="30" width="20" height="20" rx="3" fill="none" stroke="#818cf8" stroke-width="2"/>
        <line x1="32" y1="37" x2="44" y2="37" stroke="#818cf8" stroke-width="1.5"/>
        <line x1="32" y1="43" x2="41" y2="43" stroke="#818cf8" stroke-width="1.5"/>

        <text x="18" y="80" class="text-title">Nordic ERP</text>
        <text x="18" y="98" class="text-desc">Enterprise Resource Planning &amp; Orders</text>

        <!-- Mini Data Flow Chart -->
        <rect x="16" y="115" width="220" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <rect x="28" y="130" width="196" height="22" rx="3" fill="#1e293b"/>
        <text x="38" y="145" font-family="monospace" font-size="9.5px" fill="#cbd5e1">Po-2026-884 · Completed</text>
        <rect x="28" y="159" width="196" height="22" rx="3" fill="#1e293b"/>
        <text x="38" y="174" font-family="monospace" font-size="9.5px" fill="#cbd5e1">Supply Batch #41 · En Route</text>
        <rect x="28" y="188" width="196" height="22" rx="3" fill="#1e293b"/>
        <text x="38" y="203" font-family="monospace" font-size="9.5px" fill="#818cf8">Ledger: Balanced</text>

        <g transform="translate(18, 245)">
          <text x="0" y="15" class="stat-lbl">Active Work Orders</text>
          <text x="0" y="36" class="stat-val">128 <tspan font-size="11.5px" font-weight="500" fill="#64748b">in pipeline</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Inventory Accuracy</text>
          <text x="0" y="86" class="stat-val">99.4%</text>
        </g>

        <rect x="16" y="370" width="220" height="36" rx="4" fill="#1e293b" stroke="#334155"/>
        <text x="126" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#cbd5e1">Open ERP ↗</text>
      </g>

      <!-- Card 3: Nordic MES -->
      <g transform="translate(552, 0)">
        <rect width="252" height="425" class="card"/>
        <rect width="252" height="6" fill="#10b981" rx="2"/>
        <rect x="18" y="20" width="40" height="40" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <!-- Machine icon -->
        <rect x="28" y="30" width="20" height="20" fill="none" stroke="#10b981" stroke-width="2"/>
        <circle cx="38" cy="40" r="4.5" fill="#10b981"/>

        <text x="18" y="80" class="text-title">Nordic MES</text>
        <text x="18" y="98" class="text-desc">Manufacturing Execution &amp; Floor Ops</text>

        <!-- Mini Shop Floor Line Bar -->
        <rect x="16" y="115" width="220" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <text x="28" y="136" font-family="Inter, sans-serif" font-size="10.5px" font-weight="700" fill="#10b981">Line 04 · Running</text>
        <!-- Progress bar -->
        <rect x="28" y="148" width="196" height="8" rx="4" fill="#1e293b"/>
        <rect x="28" y="148" width="176" height="8" rx="4" fill="#10b981"/>
        <text x="28" y="174" font-family="Inter, sans-serif" font-size="9.5px" fill="#94a3b8">Target: 1,600 | Done: 1,420</text>
        <text x="28" y="194" font-family="monospace" font-size="9.5px" fill="#cbd5e1">Cycle Time: 4.8s / unit</text>

        <g transform="translate(18, 245)">
          <text x="0" y="15" class="stat-lbl">Overall OEE</text>
          <text x="0" y="36" class="stat-val" fill="#10b981">89.2% <tspan font-size="11.5px" font-weight="500" fill="#64748b">World Class</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Shift Output</text>
          <text x="0" y="86" class="stat-val">1,420 <tspan font-size="11.5px" font-weight="500" fill="#64748b">units</tspan></text>
        </g>

        <rect x="16" y="370" width="220" height="36" rx="4" fill="#1e293b" stroke="#334155"/>
        <text x="126" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#cbd5e1">Open MES ↗</text>
      </g>

      <!-- Card 4: Nordic EQMS -->
      <g transform="translate(828, 0)">
        <rect width="252" height="425" class="card"/>
        <rect width="252" height="6" fill="#f59e0b" rx="2"/>
        <rect x="18" y="20" width="40" height="40" rx="6" fill="rgba(245, 158, 11, 0.15)"/>
        <!-- Shield icon -->
        <path d="M 38 28 L 48 32 L 48 42 Q 38 48 38 50 Q 28 48 28 42 L 28 32 Z" fill="none" stroke="#f59e0b" stroke-width="2"/>

        <text x="18" y="80" class="text-title">Nordic EQMS</text>
        <text x="18" y="98" class="text-desc">Enterprise Quality &amp; Compliance</text>

        <!-- Mini Compliance Card -->
        <rect x="16" y="115" width="220" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <text x="28" y="136" font-family="Inter, sans-serif" font-size="10.5px" font-weight="700" fill="#f59e0b">ISO 9001 / IATF 16949</text>
        <rect x="28" y="148" width="196" height="22" rx="3" fill="#1e293b"/>
        <text x="38" y="163" font-family="monospace" font-size="9.5px" fill="#cbd5e1">Audit Score: 99.4%</text>
        <text x="28" y="190" font-family="Inter, sans-serif" font-size="9.5px" fill="#94a3b8">Active CAPA Tickets: 0</text>
        <text x="28" y="208" font-family="Inter, sans-serif" font-size="9.5px" fill="#10b981">Zero Non-conformances</text>

        <g transform="translate(18, 245)">
          <text x="0" y="15" class="stat-lbl">Compliance Rating</text>
          <text x="0" y="36" class="stat-val" fill="#f59e0b">99.4% <tspan font-size="11.5px" font-weight="500" fill="#64748b">Verified</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Open Incidents</text>
          <text x="0" y="86" class="stat-val">0 <tspan font-size="11.5px" font-weight="500" fill="#64748b">Critical</tspan></text>
        </g>

        <rect x="16" y="370" width="220" height="36" rx="4" fill="#1e293b" stroke="#334155"/>
        <text x="126" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5px" font-weight="600" fill="#cbd5e1">Open EQMS ↗</text>
      </g>

    </g>
  </g>
</svg>

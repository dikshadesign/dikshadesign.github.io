<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .app-window { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4; }
      .window-header { fill: #0f172a; }
      .panel-dark { fill: #0b1120; stroke: #1e293b; stroke-width: 1; rx: 3; }
      .panel-light { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; rx: 3; }
      .tag-vision { fill: #0284c7; }
      .tag-mes { fill: #059669; }
      .tag-eqms { fill: #d97706; }
      .connector-line { stroke: #0284c7; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .flow-card { fill: #ffffff; stroke: #0284c7; stroke-width: 1.5; rx: 4; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
      .shared-badge { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1; rx: 3; }
      .diff-badge { fill: #fef3c7; stroke: #d97706; stroke-width: 1; rx: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" class="bg"/>

  <!-- Top Title Banner -->
  <rect x="40" y="20" width="1120" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="60" y="46" class="font-sans" font-size="14px" font-weight="700" fill="#0f172a">Section 08 · Cross-Application Experience &amp; Workflow Continuity</text>
  <text x="680" y="46" class="font-sans" font-size="11px" fill="#64748b">Platform-level consistency establishes shared navigation · Application-level flexibility delivers specialized depth</text>

  <!-- Legend Bar -->
  <g transform="translate(40, 72)">
    <rect width="1120" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    
    <g transform="translate(20, 9)">
      <rect width="12" height="12" rx="2" fill="#3b82f6"/>
      <text x="20" y="10" class="font-sans" font-size="10.5px" font-weight="600" fill="#1e293b">SHARED PLATFORM ELEMENTS: Unified 56px Shell · 0px Card Radii · Inter Type Hierarchy · Single Sign-On Context</text>
    </g>

    <g transform="translate(740, 9)">
      <rect width="12" height="12" rx="2" fill="#d97706"/>
      <text x="20" y="10" class="font-sans" font-size="10.5px" font-weight="600" fill="#1e293b">DOMAIN-SPECIFIC FLEXIBILITY: Sensor Feeds vs Process Telemetry vs Form Audits</text>
    </g>
  </g>

  <!-- LEFT APPLICATION: Nordic Vision (AI Camera & Defect Detection) -->
  <g transform="translate(40, 118)">
    <rect width="545" height="430" class="app-window"/>
    
    <!-- Chrome Header -->
    <rect width="545" height="38" class="window-header" rx="4 4 0 0"/>
    <rect x="14" y="9" width="20" height="20" rx="3" fill="#0284c7"/>
    <text x="24" y="23" text-anchor="middle" class="font-sans" font-size="9px" font-weight="800" fill="#ffffff">VIS</text>
    <text x="42" y="23" class="font-sans" font-size="11.5px" font-weight="700" fill="#f8fafc">Nordic Vision <tspan fill="#38bdf8">· Camera Station 04</tspan></text>
    <rect x="420" y="9" width="110" height="20" rx="3" fill="#1e293b"/>
    <text x="475" y="22" text-anchor="middle" class="font-sans" font-size="9.5px" fill="#94a3b8">Active: Lot B-881</text>

    <!-- Sub-bar (Shared pattern) -->
    <rect y="38" width="545" height="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="56" class="font-sans" font-size="10.5px" font-weight="600" fill="#0f172a">Live Camera Optical Stream (4K 60FPS)</text>
    <text x="440" y="56" class="font-sans" font-size="9.5px" font-weight="600" fill="#0284c7">Latency: 14ms</text>

    <!-- Content Area: Specialized Camera Canvas -->
    <g transform="translate(14, 76)">
      <!-- Camera Viewport (Dark UI optimized for optical inspection) -->
      <rect width="330" height="230" fill="#090d16" stroke="#334155" stroke-width="1" rx="3"/>
      
      <!-- Crosshair / Reticle Grid -->
      <line x1="165" y1="20" x2="165" y2="210" stroke="#1e293b" stroke-dasharray="2 2"/>
      <line x1="20" y1="115" x2="310" y2="115" stroke="#1e293b" stroke-dasharray="2 2"/>
      <circle cx="165" cy="115" r="70" stroke="#1e293b" stroke-width="1" fill="none"/>

      <!-- Simulated Turbine Blade / Part -->
      <path d="M 90 170 Q 150 70 240 100 Q 210 150 140 180 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

      <!-- Defect Bounding Box -->
      <rect x="135" y="110" width="55" height="42" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1.8" rx="2"/>
      <rect x="135" y="94" width="90" height="16" fill="#f43f5e" rx="2"/>
      <text x="140" y="105" class="font-sans" font-size="8.5px" font-weight="700" fill="#ffffff">MICRO-CRACK 98.4%</text>

      <!-- Camera HUD overlay -->
      <rect x="10" y="10" width="90" height="18" fill="#1e293b" opacity="0.8" rx="2"/>
      <text x="18" y="22" class="font-sans" font-size="9px" fill="#10b981">● OPTICAL FEED OK</text>
      <text x="10" y="218" class="font-sans" font-size="8.5px" fill="#64748b">Resolution: 3840x2160 · ISO 400</text>

      <!-- Right Inspection Telemetry Side-Panel -->
      <g transform="translate(342, 0)">
        <rect width="175" height="230" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="3"/>
        <text x="12" y="22" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Anomaly Classification</text>
        
        <rect x="12" y="32" width="151" height="48" fill="#ffffff" stroke="#fecdd3" stroke-width="1" rx="3"/>
        <text x="20" y="48" class="font-sans" font-size="9px" fill="#64748b">Defect Type</text>
        <text x="20" y="63" class="font-sans" font-size="11px" font-weight="700" fill="#e11d48">Surface Fracture</text>
        <rect x="105" y="45" width="50" height="18" rx="2" fill="#fee2e2"/>
        <text x="130" y="57" text-anchor="middle" class="font-sans" font-size="8px" font-weight="700" fill="#b91c1c">SEV 1 HIGH</text>

        <rect x="12" y="88" width="151" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
        <text x="20" y="103" class="font-sans" font-size="9px" fill="#64748b">Confidence Score</text>
        <text x="20" y="118" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">98.4% Match</text>

        <!-- Automated Action Trigger -->
        <rect x="12" y="140" width="151" height="50" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" rx="3"/>
        <text x="20" y="156" class="font-sans" font-size="9px" font-weight="700" fill="#1e40af">Ecosystem Event Triggered:</text>
        <text x="20" y="172" class="font-sans" font-size="9px" fill="#3b82f6">→ Emit NC Event to EQMS</text>
        <text x="20" y="184" class="font-sans" font-size="9px" fill="#3b82f6">→ Halt Line Signal to MES</text>
      </g>
    </g>

    <!-- Bottom Footer Status -->
    <rect y="318" width="545" height="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(14, 332)">
      <rect width="18" height="18" rx="2" fill="#0284c7"/>
      <text x="23" y="13" text-anchor="middle" class="font-sans" font-size="9.5px" font-weight="700" fill="#ffffff">A</text>
      <text x="28" y="13" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Vision Interface Specifics</text>
      <text x="0" y="32" class="font-sans" font-size="9.5px" fill="#475569">High-contrast darkroom canvas with real-time bounding overlays, frame zoom controls, and hardware camera exposure tuning. Optimized for cleanroom optics technicians.</text>
      <rect x="0" y="52" width="220" height="20" class="diff-badge"/>
      <text x="8" y="65" class="font-sans" font-size="9px" font-weight="600" fill="#92400e">Specialization: High-FPS Vision Stream UI</text>
    </g>
  </g>

  <!-- RIGHT APPLICATION: Nordic MES (Manufacturing Execution on Shop Floor) -->
  <g transform="translate(615, 118)">
    <rect width="545" height="430" class="app-window"/>
    
    <!-- Chrome Header -->
    <rect width="545" height="38" class="window-header" rx="4 4 0 0"/>
    <rect x="14" y="9" width="20" height="20" rx="3" fill="#059669"/>
    <text x="24" y="23" text-anchor="middle" class="font-sans" font-size="9px" font-weight="800" fill="#ffffff">MES</text>
    <text x="42" y="23" class="font-sans" font-size="11.5px" font-weight="700" fill="#f8fafc">Nordic MES <tspan fill="#34d399">· Workstation 03 Shop Floor</tspan></text>
    <rect x="420" y="9" width="110" height="20" rx="3" fill="#1e293b"/>
    <text x="475" y="22" text-anchor="middle" class="font-sans" font-size="9.5px" fill="#94a3b8">Active: Lot B-881</text>

    <!-- Sub-bar (Shared pattern) -->
    <rect y="38" width="545" height="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="56" class="font-sans" font-size="10.5px" font-weight="600" fill="#0f172a">Production Line Telemetry &amp; Work Order Execution</text>
    <text x="420" y="56" class="font-sans" font-size="9.5px" font-weight="600" fill="#059669">Machine OEE: 91.8%</text>

    <!-- Content Area: Specialized Shop Floor Execution View -->
    <g transform="translate(14, 76)">
      <!-- Left: Active Work Order Card with Incoming Defect Alert -->
      <g transform="translate(0, 0)">
        <rect width="255" height="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
        <text x="12" y="22" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Active Work Order #WO-8912</text>
        <text x="12" y="38" class="font-sans" font-size="9.5px" fill="#64748b">SKU: Titanium Compressor Blade Type A</text>

        <!-- INCOMING ALERT CARD FROM VISION EVENT -->
        <rect x="12" y="48" width="231" height="88" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2" rx="3"/>
        <circle cx="26" cy="64" r="5" fill="#f43f5e"/>
        <text x="36" y="67" class="font-sans" font-size="10px" font-weight="700" fill="#9f1239">WORK ORDER PAUSED (EQMS #NC-4402)</text>
        <text x="16" y="86" class="font-sans" font-size="8.8px" fill="#4c0519">Trigger: Station 04 Vision flagged crack on Batch B-881.</text>
        <text x="16" y="100" class="font-sans" font-size="8.8px" fill="#4c0519">Operator Action: Inspect part, quarantine serial #402-A.</text>
        
        <rect x="16" y="110" width="95" height="18" fill="#f43f5e" rx="2"/>
        <text x="63" y="122" text-anchor="middle" class="font-sans" font-size="8.5px" font-weight="700" fill="#ffffff">Acknowledge Alert</text>
        <rect x="118" y="110" width="118" height="18" fill="#ffffff" stroke="#e11d48" stroke-width="1" rx="2"/>
        <text x="177" y="122" text-anchor="middle" class="font-sans" font-size="8px" font-weight="600" fill="#e11d48">Open Vision Feed ↗</text>

        <!-- Shift Performance Metrics -->
        <g transform="translate(12, 146)">
          <text x="0" y="12" class="font-sans" font-size="9.5px" font-weight="600" fill="#64748b">Shift Output</text>
          <text x="180" y="12" class="font-sans" font-size="9.5px" font-weight="700" fill="#0f172a">412 / 500 pcs</text>
          <rect y="18" width="231" height="8" fill="#e2e8f0" rx="2"/>
          <rect y="18" width="190" height="8" fill="#059669" rx="2"/>

          <text x="0" y="42" class="font-sans" font-size="9px" fill="#64748b">Scrap Rate Today: <tspan font-weight="700" fill="#e11d48">0.4%</tspan> (1 defective flagged)</text>
          <text x="0" y="58" class="font-sans" font-size="9px" fill="#64748b">Supervisor On Duty: H. Lindqvist (Shift A)</text>
        </g>
      </g>

      <!-- Right: Workstation Machine Status & Sensor Gauges -->
      <g transform="translate(268, 0)">
        <rect width="250" height="230" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="3"/>
        <text x="12" y="22" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Line 03 CNC Telemetry</text>

        <rect x="12" y="32" width="226" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
        <text x="20" y="48" class="font-sans" font-size="9px" fill="#64748b">Spindle Speed</text>
        <text x="20" y="63" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">12,450 RPM</text>
        <text x="150" y="56" class="font-sans" font-size="9px" fill="#10b981">● NOMINAL</text>

        <rect x="12" y="82" width="226" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
        <text x="20" y="98" class="font-sans" font-size="9px" fill="#64748b">Coolant Pressure</text>
        <text x="20" y="113" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">4.8 Bar</text>
        <text x="150" y="106" class="font-sans" font-size="9px" fill="#10b981">● NOMINAL</text>

        <rect x="12" y="132" width="226" height="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3"/>
        <text x="20" y="148" class="font-sans" font-size="9px" font-weight="700" fill="#0f172a">Digital Travel Sheet (B-881)</text>
        <text x="20" y="166" class="font-sans" font-size="8.5px" fill="#64748b">Step 1: Rough Milling — <tspan fill="#10b981">Completed</tspan></text>
        <text x="20" y="180" class="font-sans" font-size="8.5px" fill="#64748b">Step 2: Finish Grinding — <tspan fill="#10b981">Completed</tspan></text>
        <text x="20" y="194" class="font-sans" font-size="8.5px" fill="#e11d48">Step 3: Vision Inspection — Halted at 11:42</text>
        <text x="20" y="208" class="font-sans" font-size="8.5px" fill="#64748b">Step 4: Quality Signoff (EQMS Pending)</text>
      </g>
    </g>

    <!-- Bottom Footer Status -->
    <rect y="318" width="545" height="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(14, 332)">
      <rect width="18" height="18" rx="2" fill="#059669"/>
      <text x="23" y="13" text-anchor="middle" class="font-sans" font-size="9.5px" font-weight="700" fill="#ffffff">B</text>
      <text x="28" y="13" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">MES Interface Specifics</text>
      <text x="0" y="32" class="font-sans" font-size="9.5px" fill="#475569">Touch-friendly 44px hit-targets, high-visibility warning banners, and real-time physical workstation telemetry designed for gloved factory operators standing on concrete floors.</text>
      <rect x="0" y="52" width="230" height="20" class="diff-badge"/>
      <text x="8" y="65" class="font-sans" font-size="9px" font-weight="600" fill="#92400e">Specialization: High-Contrast Shop Floor HMI</text>
    </g>
  </g>

  <!-- MIDDLE CONNECTING BRIDGE / WORKFLOW PIPELINE (Section 08 Central Concept) -->
  <g transform="translate(40, 560)">
    <rect width="1120" height="100" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>
    
    <!-- Flow Title -->
    <text x="24" y="25" class="font-sans" font-size="11.5px" font-weight="700" fill="#0f172a">CROSS-APPLICATION DATA CONTINUITY PIPELINE (ZERO DATA SILO)</text>
    <text x="800" y="25" class="font-sans" font-size="10.5px" fill="#64748b">All 5 applications communicate via shared Event Bus</text>

    <!-- Step 1 -->
    <g transform="translate(24, 38)">
      <rect width="240" height="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="3"/>
      <circle cx="16" cy="16" r="8" fill="#0284c7"/>
      <text x="16" y="19" text-anchor="middle" class="font-sans" font-size="9px" font-weight="800" fill="#ffffff">1</text>
      <text x="32" y="18" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Nordic Vision Flag</text>
      <text x="12" y="36" class="font-sans" font-size="8.8px" fill="#64748b">AI model confirms defect on Lot B-881</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 270 62 L 310 62" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- Step 2 -->
    <g transform="translate(315, 38)">
      <rect width="240" height="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="3"/>
      <circle cx="16" cy="16" r="8" fill="#d97706"/>
      <text x="16" y="19" text-anchor="middle" class="font-sans" font-size="9px" font-weight="800" fill="#ffffff">2</text>
      <text x="32" y="18" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Nordic EQMS Auto-Ticket</text>
      <text x="12" y="36" class="font-sans" font-size="8.8px" fill="#64748b">Generates Non-Conformance #NC-4402</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 561 62 L 601 62" stroke="#3b82f6" stroke-width="2" fill="none"/>

    <!-- Step 3 -->
    <g transform="translate(606, 38)">
      <rect width="240" height="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="3"/>
      <circle cx="16" cy="16" r="8" fill="#059669"/>
      <text x="16" y="19" text-anchor="middle" class="font-sans" font-size="9px" font-weight="800" fill="#ffffff">3</text>
      <text x="32" y="18" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Nordic MES Line Interlock</text>
      <text x="12" y="36" class="font-sans" font-size="8.8px" fill="#64748b">Pauses CNC Station 03 Work Order</text>
    </g>

    <!-- Arrow 3 to 4 -->
    <path d="M 852 62 L 892 62" stroke="#3b82f6" stroke-width="2" fill="none"/>

    <!-- Step 4 -->
    <g transform="translate(897, 38)">
      <rect width="200" height="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="3"/>
      <circle cx="16" cy="16" r="8" fill="#4f46e5"/>
      <text x="16" y="19" text-anchor="middle" class="font-sans" font-size="9px" font-weight="800" fill="#ffffff">4</text>
      <text x="32" y="18" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Nordic ERP Ledger</text>
      <text x="12" y="36" class="font-sans" font-size="8.8px" fill="#64748b">Quarantines inventory batch</text>
    </g>
  </g>
</svg>

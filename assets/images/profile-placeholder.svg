<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e232d"/>
      <stop offset="50%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="480" fill="url(#bgGrad)"/>
  <rect width="400" height="480" fill="url(#gridPattern)"/>

  <!-- Ambient Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#accentGlow)"/>

  <!-- Stylized Designer Portrait Silhouette -->
  <!-- Shoulders & Torso -->
  <path d="M 90 480 C 95 380, 130 340, 200 340 C 270 340, 305 380, 310 480 Z" fill="url(#silhouetteGrad)"/>
  
  <!-- Neck -->
  <rect x="180" y="250" width="40" height="70" rx="6" fill="#64748b"/>
  
  <!-- Head Silhouette -->
  <path d="M 145 185 C 145 120, 170 90, 200 90 C 230 90, 255 120, 255 185 C 255 235, 230 270, 200 270 C 170 270, 145 235, 145 185 Z" fill="#64748b"/>
  
  <!-- Hair Contour -->
  <path d="M 135 180 C 135 110, 165 75, 200 75 C 235 75, 265 110, 265 180 C 265 210, 260 250, 260 250 C 255 220, 250 160, 235 140 C 220 125, 180 125, 165 140 C 150 160, 145 220, 140 250 C 140 250, 135 210, 135 180 Z" fill="#334155"/>

  <!-- Minimal Glasses Frame (Designer signature motif) -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" opacity="0.85">
    <rect x="160" y="155" width="32" height="24" rx="4"/>
    <rect x="208" y="155" width="32" height="24" rx="4"/>
    <line x1="192" y1="167" x2="208" y2="167"/>
    <line x1="148" y1="165" x2="160" y2="167"/>
    <line x1="240" y1="167" x2="252" y2="165"/>
  </g>

  <!-- Industrial Compass / Coordinate Crosshair Corner Accents -->
  <g stroke="#475569" stroke-width="1.2" opacity="0.6">
    <!-- Top-Left Target -->
    <line x1="24" y1="24" x2="44" y2="24"/>
    <line x1="24" y1="24" x2="24" y2="44"/>
    <!-- Top-Right Target -->
    <line x1="376" y1="24" x2="356" y2="24"/>
    <line x1="376" y1="24" x2="376" y2="44"/>
    <!-- Bottom-Left Target -->
    <line x1="24" y1="456" x2="44" y2="456"/>
    <line x1="24" y1="456" x2="24" y2="436"/>
    <!-- Bottom-Right Target -->
    <line x1="376" y1="456" x2="356" y2="456"/>
    <line x1="376" y1="456" x2="376" y2="436"/>
  </g>

  <!-- Photo Swap Badge at Bottom -->
  <g transform="translate(40, 410)">
    <rect width="320" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.95"/>
    <circle cx="24" cy="21" r="5" fill="#38bdf8"/>
    <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5px" font-weight="600" fill="#f8fafc">Diksha Shinde · Industrial &amp; IxD</text>
    <text x="245" y="25" font-family="ui-monospace, monospace" font-size="9.5px" fill="#94a3b8">NID MP</text>
  </g>
</svg>

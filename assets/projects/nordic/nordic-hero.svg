<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .shell { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 8; }
      .top-nav { fill: #090d16; stroke-bottom: #1e293b; }
      .card { fill: #131c31; stroke: #1e293b; stroke-width: 1.2; rx: 6; }
      .card-active { fill: #16223d; stroke: #38bdf8; stroke-width: 1.5; rx: 6; }
      .app-icon { rx: 8; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 11px; fill: #94a3b8; line-height: 1.45; }
      .badge { fill: rgba(56, 189, 248, 0.12); stroke: rgba(56, 189, 248, 0.35); rx: 10; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.08em; text-transform: uppercase; }
      .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; fill: #f8fafc; }
      .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 9.5px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
    </style>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="650" class="bg"/>

  <!-- Desktop Operating Window Frame -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="610" class="shell"/>

    <!-- Global App Shell Header -->
    <path d="M 0 8 Q 0 0 8 0 L 1132 0 Q 1140 0 1140 8 L 1140 52 L 0 52 Z" fill="#090e1a"/>
    <line x1="0" y1="52" x2="1140" y2="52" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Window Controls -->
    <circle cx="25" cy="26" r="5" fill="#ef4444"/>
    <circle cx="42" cy="26" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="26" r="5" fill="#10b981"/>

    <!-- Nordic ONE Brand / Logo -->
    <g transform="translate(90, 16)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#38bdf8"/>
      <polygon points="11,4 17,17 5,17" fill="#090e1a"/>
      <text x="32" y="16" font-family="Inter, sans-serif" font-size="13px" font-weight="800" fill="#f8fafc" letter-spacing="0.06em">NORDIC <tspan fill="#38bdf8">ONE</tspan></text>
      <text x="125" y="16" font-family="Inter, sans-serif" font-size="11px" font-weight="500" fill="#64748b">/ Enterprise Hub</text>
    </g>

    <!-- Global Search Bar (Universal Switcher) -->
    <g transform="translate(390, 12)">
      <rect width="360" height="28" rx="5" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" font-family="Inter, sans-serif" font-size="11px" fill="#64748b">Search operations, apps, work orders... (Ctrl + K)</text>
      <rect x="315" y="5" width="36" height="18" rx="3" fill="#1e293b"/>
      <text x="333" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="9px" font-weight="600" fill="#94a3b8">⌘K</text>
    </g>

    <!-- Right User & Tenant Status -->
    <g transform="translate(920, 14)">
      <rect x="0" y="2" width="120" height="22" rx="11" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="13" r="3.5" fill="#10b981"/>
      <text x="24" y="16" font-family="Inter, sans-serif" font-size="10px" font-weight="700" fill="#10b981">ALL SYSTEMS OK</text>
      <circle cx="145" cy="13" r="13" fill="#334155"/>
      <text x="145" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="10px" font-weight="700" fill="#f8fafc">DS</text>
    </g>

    <!-- Sub-header Breadcrumb / Ecosystem Banner -->
    <g transform="translate(30, 75)">
      <text x="0" y="20" font-family="Inter, sans-serif" font-size="20px" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">Industrial Software Ecosystem</text>
      <text x="0" y="40" font-family="Inter, sans-serif" font-size="12px" fill="#94a3b8">Central operational suite connecting manufacturing execution, enterprise planning, quality, security, and machine vision.</text>
      <rect x="940" y="8" width="140" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="1010" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5px" font-weight="600" fill="#38bdf8">Plant: Skövde Line 4 ▾</text>
    </g>

    <!-- 5 Unified Application Launcher Cards -->
    <g transform="translate(30, 145)">
      
      <!-- Card 1: Nordic Vision -->
      <g transform="translate(0, 0)">
        <rect width="206" height="425" class="card-active"/>
        <rect width="206" height="6" fill="#38bdf8" rx="2"/>
        <rect x="16" y="20" width="38" height="38" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
        <circle cx="35" cy="39" r="9" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="35" cy="39" r="4" fill="#38bdf8"/>
        
        <text x="16" y="80" class="text-title">Nordic Vision</text>
        <text x="16" y="98" class="text-desc">Machine Vision &amp; Optical Inspection</text>

        <!-- Mini Camera Preview -->
        <rect x="14" y="115" width="178" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <!-- Inspection Bounding Box -->
        <rect x="35" y="135" width="80" height="60" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
        <rect x="35" y="125" width="45" height="12" fill="#10b981" rx="2"/>
        <text x="40" y="134" font-family="monospace" font-size="8px" font-weight="700" fill="#090e1a">PASS 99.8%</text>
        <circle cx="150" cy="165" r="14" fill="rgba(56, 189, 248, 0.2)"/>

        <!-- Real-time Stats -->
        <g transform="translate(16, 245)">
          <text x="0" y="15" class="stat-lbl">Inspection Rate</text>
          <text x="0" y="36" class="stat-val">420 <tspan font-size="11px" font-weight="500" fill="#64748b">parts/min</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Defect Detection</text>
          <text x="0" y="86" class="stat-val" fill="#10b981">0.02% <tspan font-size="11px" font-weight="500" fill="#64748b">defect rate</tspan></text>
        </g>

        <!-- Launch Button -->
        <rect x="14" y="370" width="178" height="36" rx="4" fill="#38bdf8"/>
        <text x="103" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11px" font-weight="700" fill="#090e1a">OPEN VISION ↗</text>
      </g>

      <!-- Card 2: Nordic ERP -->
      <g transform="translate(228, 0)">
        <rect width="206" height="425" class="card"/>
        <rect width="206" height="6" fill="#818cf8" rx="2"/>
        <rect x="16" y="20" width="38" height="38" rx="6" fill="rgba(129, 140, 248, 0.15)"/>
        <!-- Ledger icon -->
        <rect x="25" y="29" width="20" height="20" rx="3" fill="none" stroke="#818cf8" stroke-width="2"/>
        <line x1="29" y1="36" x2="41" y2="36" stroke="#818cf8" stroke-width="1.5"/>
        <line x1="29" y1="42" x2="38" y2="42" stroke="#818cf8" stroke-width="1.5"/>

        <text x="16" y="80" class="text-title">Nordic ERP</text>
        <text x="16" y="98" class="text-desc">Enterprise Resource Planning &amp; Orders</text>

        <!-- Mini Data Flow Chart -->
        <rect x="14" y="115" width="178" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <rect x="26" y="132" width="154" height="20" rx="3" fill="#1e293b"/>
        <text x="34" y="146" font-family="monospace" font-size="9px" fill="#cbd5e1">PO-2026-884 · Completed</text>
        <rect x="26" y="160" width="154" height="20" rx="3" fill="#1e293b"/>
        <text x="34" y="174" font-family="monospace" font-size="9px" fill="#cbd5e1">Supply Batch #41 · En Route</text>
        <rect x="26" y="188" width="154" height="20" rx="3" fill="#1e293b"/>
        <text x="34" y="202" font-family="monospace" font-size="9px" fill="#818cf8">Ledger: Balanced</text>

        <g transform="translate(16, 245)">
          <text x="0" y="15" class="stat-lbl">Active Work Orders</text>
          <text x="0" y="36" class="stat-val">128 <tspan font-size="11px" font-weight="500" fill="#64748b">in pipeline</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Inventory Accuracy</text>
          <text x="0" y="86" class="stat-val">99.4%</text>
        </g>

        <rect x="14" y="370" width="178" height="36" rx="4" fill="#1e293b" stroke="#334155"/>
        <text x="103" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11px" font-weight="600" fill="#cbd5e1">OPEN ERP ↗</text>
      </g>

      <!-- Card 3: Nordic MES -->
      <g transform="translate(456, 0)">
        <rect width="206" height="425" class="card"/>
        <rect width="206" height="6" fill="#10b981" rx="2"/>
        <rect x="16" y="20" width="38" height="38" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <!-- Machine icon -->
        <rect x="26" y="30" width="18" height="18" fill="none" stroke="#10b981" stroke-width="2"/>
        <circle cx="35" cy="39" r="4" fill="#10b981"/>

        <text x="16" y="80" class="text-title">Nordic MES</text>
        <text x="16" y="98" class="text-desc">Manufacturing Execution &amp; Floor Ops</text>

        <!-- Mini Shop Floor Line Bar -->
        <rect x="14" y="115" width="178" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <text x="26" y="136" font-family="Inter, sans-serif" font-size="10px" font-weight="700" fill="#10b981">LINE 04 · RUNNING</text>
        <!-- Progress bar -->
        <rect x="26" y="148" width="154" height="8" rx="4" fill="#1e293b"/>
        <rect x="26" y="148" width="138" height="8" rx="4" fill="#10b981"/>
        <text x="26" y="174" font-family="Inter, sans-serif" font-size="9px" fill="#94a3b8">Target: 1,600 | Done: 1,420</text>
        <text x="26" y="194" font-family="monospace" font-size="9px" fill="#cbd5e1">Cycle Time: 4.8s / unit</text>

        <g transform="translate(16, 245)">
          <text x="0" y="15" class="stat-lbl">Overall OEE</text>
          <text x="0" y="36" class="stat-val" fill="#10b981">89.2% <tspan font-size="11px" font-weight="500" fill="#64748b">World Class</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Shift Output</text>
          <text x="0" y="86" class="stat-val">1,420 <tspan font-size="11px" font-weight="500" fill="#64748b">units</tspan></text>
        </g>

        <rect x="14" y="370" width="178" height="36" rx="4" fill="#1e293b" stroke="#334155"/>
        <text x="103" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11px" font-weight="600" fill="#cbd5e1">OPEN MES ↗</text>
      </g>

      <!-- Card 4: Nordic EQMS -->
      <g transform="translate(684, 0)">
        <rect width="206" height="425" class="card"/>
        <rect width="206" height="6" fill="#f59e0b" rx="2"/>
        <rect x="16" y="20" width="38" height="38" rx="6" fill="rgba(245, 158, 11, 0.15)"/>
        <!-- Shield icon -->
        <path d="M 35 28 L 45 32 L 45 42 Q 35 48 35 50 Q 25 48 25 42 L 25 32 Z" fill="none" stroke="#f59e0b" stroke-width="2"/>

        <text x="16" y="80" class="text-title">Nordic EQMS</text>
        <text x="16" y="98" class="text-desc">Enterprise Quality &amp; Compliance</text>

        <!-- Mini Compliance Card -->
        <rect x="14" y="115" width="178" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <text x="26" y="136" font-family="Inter, sans-serif" font-size="10px" font-weight="700" fill="#f59e0b">ISO 9001 / IATF 16949</text>
        <rect x="26" y="148" width="154" height="20" rx="3" fill="#1e293b"/>
        <text x="34" y="162" font-family="monospace" font-size="9px" fill="#cbd5e1">Audit Score: 99.4%</text>
        <text x="26" y="190" font-family="Inter, sans-serif" font-size="9px" fill="#94a3b8">Active CAPA Tickets: 0</text>
        <text x="26" y="208" font-family="Inter, sans-serif" font-size="9px" fill="#10b981">Zero Non-conformances</text>

        <g transform="translate(16, 245)">
          <text x="0" y="15" class="stat-lbl">Compliance Rating</text>
          <text x="0" y="36" class="stat-val" fill="#f59e0b">99.4% <tspan font-size="11px" font-weight="500" fill="#64748b">Verified</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Open Incidents</text>
          <text x="0" y="86" class="stat-val">0 <tspan font-size="11px" font-weight="500" fill="#64748b">Critical</tspan></text>
        </g>

        <rect x="14" y="370" width="178" height="36" rx="4" fill="#1e293b" stroke="#334155"/>
        <text x="103" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11px" font-weight="600" fill="#cbd5e1">OPEN EQMS ↗</text>
      </g>

      <!-- Card 5: Nordic Visitor Management -->
      <g transform="translate(912, 0)">
        <rect width="206" height="425" class="card"/>
        <rect width="206" height="6" fill="#a855f7" rx="2"/>
        <rect x="16" y="20" width="38" height="38" rx="6" fill="rgba(168, 85, 247, 0.15)"/>
        <!-- Badge User icon -->
        <circle cx="35" cy="35" r="6" fill="none" stroke="#a855f7" stroke-width="2"/>
        <path d="M 25 47 Q 35 41 45 47" fill="none" stroke="#a855f7" stroke-width="2"/>

        <text x="16" y="80" class="text-title">Nordic Visitor</text>
        <text x="16" y="98" class="text-desc">Access Control &amp; Contractor Clearance</text>

        <!-- Mini Kiosk Telemetry -->
        <rect x="14" y="115" width="178" height="110" fill="#090e1a" stroke="#1e293b" rx="4"/>
        <text x="26" y="136" font-family="Inter, sans-serif" font-size="10px" font-weight="700" fill="#a855f7">SECURITY GATEWAY 01</text>
        <rect x="26" y="148" width="154" height="20" rx="3" fill="#1e293b"/>
        <text x="34" y="162" font-family="monospace" font-size="9px" fill="#cbd5e1">18 Visitors Checked-In</text>
        <text x="26" y="190" font-family="Inter, sans-serif" font-size="9px" fill="#94a3b8">Kiosk Battery: 100%</text>
        <text x="26" y="208" font-family="Inter, sans-serif" font-size="9px" fill="#10b981">NDAs Signed: 100%</text>

        <g transform="translate(16, 245)">
          <text x="0" y="15" class="stat-lbl">On-Site Visitors</text>
          <text x="0" y="36" class="stat-val">18 <tspan font-size="11px" font-weight="500" fill="#64748b">Guests &amp; Techs</tspan></text>
          
          <text x="0" y="65" class="stat-lbl">Avg Clearance Time</text>
          <text x="0" y="86" class="stat-val">42s <tspan font-size="11px" font-weight="500" fill="#64748b">Self Kiosk</tspan></text>
        </g>

        <rect x="14" y="370" width="178" height="36" rx="4" fill="#1e293b" stroke="#334155"/>
        <text x="103" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="11px" font-weight="600" fill="#cbd5e1">OPEN VISITOR ↗</text>
      </g>

    </g>
  </g>
</svg>
